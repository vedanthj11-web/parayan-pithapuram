<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shripad Shrivallabh Charitamrut Samohik Parayan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --saffron:#e2711d;
    --saffron-dark:#c85a0e;
    --maroon:#7a2e2e;
    --cream:#fff8ee;
    --ink:#332218;
    --border:#e8d9c0;
    --success:#2f7d4f;
    --error:#c0392b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;max-width:100%;overflow-x:hidden;}
  body{
    font-family:'Poppins','Noto Sans Devanagari',sans-serif;
    background:linear-gradient(180deg,#fff8ee 0%,#fbeed9 100%);
    color:var(--ink);
    min-height:100vh;
  }
  .page{padding:0 0 60px;}
  .language-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at top left, rgba(226,113,29,0.18), transparent 40%),
      radial-gradient(circle at bottom right, rgba(122,46,46,0.16), transparent 38%),
      linear-gradient(180deg,#fff8ee 0%,#fbe7c6 100%);
  }
  .language-card{
    width:min(100%,760px);
    background:rgba(255,255,255,0.95);
    border:1px solid rgba(232,217,192,0.9);
    border-radius:28px;
    box-shadow:0 22px 56px rgba(122,46,46,0.14);
    padding:28px;
    text-align:center;
  }
  .language-title{
    font-family:'Noto Serif','Noto Sans Devanagari',serif;
    font-size:clamp(28px,5vw,44px);
    color:var(--maroon);
    margin:0 0 12px;
    line-height:1.15;
  }
  .language-subtitle{
    margin:0 0 28px;
    font-size:clamp(16px,2.6vw,20px);
    color:#7a6a55;
  }
  .language-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  .language-btn{
    border:none;
    cursor:pointer;
    width:100%;
    min-height:180px;
    border-radius:22px;
    padding:24px 20px;
    font:inherit;
    transition:transform .14s ease, box-shadow .14s ease, background .14s ease;
    box-shadow:0 12px 30px rgba(122,46,46,0.1);
  }
  .language-btn:hover{transform:translateY(-2px);}
  .language-btn.marathi{
    background:linear-gradient(135deg,#7a2e2e,#9e4c2e);
    color:#fff7ea;
  }
  .language-btn.english{
    background:linear-gradient(135deg,#e2711d,#f1a349);
    color:#fffaf3;
  }
  .language-btn .big{
    display:block;
    font-size:clamp(26px,5vw,40px);
    font-weight:700;
    margin-bottom:10px;
  }
  .language-btn .small{
    display:block;
    font-size:clamp(15px,2.8vw,20px);
    opacity:.95;
  }
  header{
    background:linear-gradient(120deg,var(--maroon),#5c2020);
    color:#fdf1df;
    padding:28px 20px 34px;
    text-align:center;
    box-shadow:0 4px 18px rgba(0,0,0,0.15);
  }
  header h1{
    font-family:'Noto Serif','Noto Sans Devanagari',serif;
    font-size:clamp(20px,4vw,30px);
    margin:0 0 8px;
    line-height:1.3;
  }
  header p{
    margin:0;
    font-size:clamp(14px,2.8vw,16px);
    color:#f3d9b0;
  }
  .dates{
    display:inline-block;
    margin-top:12px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.28);
    padding:6px 16px;
    border-radius:999px;
    font-size:14px;
    letter-spacing:.2px;
  }
  .container{
    width:min(100%,720px);
    margin:-20px auto 0;
    padding:0 16px;
  }
  form{
    background:#fffefb;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(122,46,46,0.12);
    padding:clamp(18px,4vw,34px);
    margin-top:20px;
  }
  .section{margin-bottom:28px;}
  .section-title{
    font-size:16px;
    font-weight:700;
    color:var(--saffron-dark);
    margin-bottom:14px;
    padding-bottom:8px;
    border-bottom:2px solid var(--border);
  }
  .field{margin-bottom:18px;}
  label{
    display:block;
    font-weight:600;
    font-size:14.5px;
    margin-bottom:6px;
    color:var(--ink);
  }
  .req{color:var(--saffron-dark);}
  .hint{
    font-size:12px;
    color:#a3906f;
    margin-top:5px;
  }
  input[type="text"],input[type="tel"],input[type="number"]{
    width:100%;
    padding:12px 14px;
    font-size:15px;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:#fffdf9;
    font-family:inherit;
    color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
    appearance:none;
  }
  input:focus{
    outline:none;
    border-color:var(--saffron);
    box-shadow:0 0 0 3px rgba(226,113,29,0.15);
  }
  .count-pills{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }
  .count-pill{
    min-height:52px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:#fffdf9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:all .15s;
  }
  .count-pill:hover{border-color:var(--saffron);}
  .count-pill.selected{
    background:var(--saffron);
    border-color:var(--saffron);
    color:#fff;
  }
  .person-blocks{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .person-card{
    background:var(--cream);
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:14px;
  }
  .p-title{
    font-weight:700;
    font-size:14px;
    color:var(--maroon);
    margin-bottom:10px;
  }
  .person-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  .gender-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .gender-option,.radio-option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    background:#fffdf9;
  }
  .gender-option:hover,.radio-option:hover{border-color:var(--saffron);}
  .gender-option.selected,.radio-option.selected{
    border-color:var(--saffron);
    background:#fff3e4;
  }
  .gender-option input,.radio-option input{
    margin-top:2px;
    accent-color:var(--saffron-dark);
    width:18px;
    height:18px;
    flex-shrink:0;
  }
  .radio-group{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option-text strong{
    display:block;
    font-size:14.5px;
  }
  .option-text span{
    font-size:12.5px;
    color:#7a6a55;
  }
  .submit-btn{
    width:100%;
    padding:16px;
    font-size:16px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(120deg,var(--saffron),var(--saffron-dark));
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(226,113,29,0.35);
  }
  .submit-btn:disabled{opacity:.65;cursor:not-allowed;}
  .error-text{
    color:var(--error);
    font-size:12.5px;
    margin-top:5px;
    display:none;
  }
  .field.invalid input{border-color:var(--error);}
  .field.invalid .error-text{display:block;}
  .inline-error{
    color:var(--error);
    font-size:12.5px;
    margin-top:8px;
    display:none;
  }
  .inline-error.show{display:block;}
  #statusBox{
    display:none;
    text-align:center;
    padding:40px 20px;
  }
  #statusBox.show{display:block;}
  #statusBox.error #statusIcon{color:var(--error);}
  #statusIcon{
    font-size:52px;
    margin-bottom:14px;
    color:var(--success);
  }
  #statusBox h2{
    font-family:'Noto Serif','Noto Sans Devanagari',serif;
    margin-bottom:8px;
  }
  #statusBox p{
    color:#6b5a45;
    font-size:14.5px;
    word-break:break-word;
  }
  .spinner{
    display:inline-block;
    width:18px;
    height:18px;
    border:2.5px solid rgba(255,255,255,0.5);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{
    text-align:center;
    margin-top:24px;
    font-size:12px;
    color:#a3906f;
  }
  @media (min-width:640px){
    .language-grid{grid-template-columns:1fr 1fr;}
    .person-grid{grid-template-columns:2fr 1fr 1.4fr;}
  }
  @media (max-width:480px){
    header{padding:24px 14px 30px;}
    form{padding:18px 14px;}
    .language-card{padding:20px 16px;}
    .language-btn{min-height:160px;}
  }
</style>
</head>
<body>
<div id="languageScreen" class="language-screen">
  <div class="language-card">
    <h1 class="language-title" id="languageTitle">Choose Your Language</h1>
    <p class="language-subtitle" id="languageSubtitle"></p>
    <div class="language-grid">
      <button type="button" class="language-btn marathi" data-language="mr">
        <span class="big" id="languageMarathiTitle"></span>
        <span class="small" id="languageMarathiText"></span>
      </button>
      <button type="button" class="language-btn english" data-language="en">
        <span class="big" id="languageEnglishTitle"></span>
        <span class="small" id="languageEnglishText"></span>
      </button>
    </div>
  </div>
</div>

<div id="app" class="page" style="display:none;">
  <header>
    <h1 id="headerTitle"></h1>
    <p id="headerSubtitle"></p>
    <div class="dates" id="headerDates"></div>
  </header>
  <div class="container">
    <form id="regForm" novalidate>
      <div id="formBody">
        <div class="section">
          <div class="section-title" id="countSectionTitle"></div>
          <div class="field">
            <label id="countLabel" for="participantCount"></label>
            <div class="count-pills" id="countPills"></div>
          </div>
          <div class="person-blocks" id="participantBlocks"></div>
          <div class="inline-error" id="participantError"></div>
        </div>

        <div class="section">
          <div class="section-title" id="locationSectionTitle"></div>
          <div class="field" id="field-pincode">
            <label id="pincodeLabel" for="pincode"></label>
            <input type="text" id="pincode" inputmode="numeric" maxlength="6" required>
            <div class="hint" id="pincodeHint"></div>
            <div class="error-text" id="pincodeError"></div>
          </div>
        </div>

        <div class="section">
          <div class="section-title" id="accomSectionTitle"></div>
          <div class="field" id="field-accom">
            <div class="radio-group" id="accomGroup"></div>
            <div class="error-text" id="accomError"></div>
          </div>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn"></button>
    </form>

    <div id="statusBox">
      <div id="statusIcon">✓</div>
      <h2 id="statusTitle"></h2>
      <p id="statusMsg"></p>
    </div>
    <footer id="footerText"></footer>
  </div>
</div>

    successMessage: "\u0927\u0928\u094d\u092f\u0935\u093e\u0926. {count} \u0938\u0939\u092d\u093e\u0917\u0940\u0902\u091a\u0940 \u0928\u094b\u0902\u0926\u0923\u0940 \u092a\u0942\u0930\u094d\u0923 \u091d\u093e\u0932\u0940. \u0938\u092c\u092e\u093f\u0936\u0928 \u0915\u094d\u0930\u092e\u093e\u0902\u0915: {submissionId}",
    successMessageRetry: "\u0928\u094b\u0902\u0926\u0923\u0940 \u091c\u0924\u0928 \u091d\u093e\u0932\u0940 \u0906\u0939\u0947. {count} \u0938\u0939\u092d\u093e\u0917\u0940\u0902\u091a\u0940 \u0928\u094b\u0902\u0926\u0923\u0940 \u092a\u0942\u0930\u094d\u0923 \u091d\u093e\u0932\u0940. \u0938\u092c\u092e\u093f\u0936\u0928 \u0915\u094d\u0930\u092e\u093e\u0902\u0915: {submissionId}",
    failureTitle: "\u0938\u092c\u092e\u093f\u0936\u0928 \u0905\u092f\u0936\u0938\u094d\u0935\u0940",
    failureMessage: "\u0938\u092c\u092e\u093f\u0936\u0928 \u0916\u093e\u0924\u094d\u0930\u0940\u0936\u0940\u0930 \u0939\u094b\u090a \u0936\u0915\u0932\u0947 \u0928\u093e\u0939\u0940. \u0915\u0943\u092a\u092f\u093e \u092a\u0941\u0928\u094d\u0939\u093e \u092a\u094d\u0930\u092f\u0924\u094d\u0928 \u0915\u0930\u093e.",
    footer: "\u0936\u094d\u0930\u0940\u092a\u093e\u0926 \u0936\u094d\u0930\u0940\u0935\u0932\u094d\u0932\u092d \u091a\u0930\u093f\u0924\u093e\u092e\u0943\u0924 \u0938\u093e\u092e\u0942\u0939\u093f\u0915 \u092a\u093e\u0930\u093e\u092f\u0923 \u00b7 \u092a\u093f\u0920\u093e\u092a\u0941\u0930\u092e, 2026"
  }
};

document.querySelectorAll(".language-btn").forEach(function(button){
  button.addEventListener("click", function(){
    selectLanguage(button.dataset.language);
  });
});

document.getElementById("regForm").addEventListener("submit", handleSubmit);
renderLanguageChooser();

function renderLanguageChooser(){
  document.getElementById("languageTitle").textContent = TEXTS.en.languageTitle;
  document.getElementById("languageSubtitle").textContent = TEXTS.en.languageSubtitle;
  document.getElementById("languageMarathiTitle").textContent = TEXTS.en.languageMarathiTitle;
  document.getElementById("languageMarathiText").textContent = TEXTS.en.languageMarathiText;
  document.getElementById("languageEnglishTitle").textContent = TEXTS.en.languageEnglishTitle;
  document.getElementById("languageEnglishText").textContent = TEXTS.en.languageEnglishText;
}

function selectLanguage(language){
  currentLanguage = language;
  document.getElementById("languageScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  applyLanguage();
  renderCountPills();
  renderParticipantBlocks();
}

function t(key){
  return TEXTS[currentLanguage][key];
}

function applyLanguage(){
  document.documentElement.lang = currentLanguage === "mr" ? "mr" : "en";
  document.title = t("pageTitle");
  document.getElementById("headerTitle").textContent = t("headerTitle");
  document.getElementById("headerSubtitle").textContent = t("headerSubtitle");
  document.getElementById("headerDates").textContent = t("headerDates");
  document.getElementById("countSectionTitle").textContent = t("countSectionTitle");
  document.getElementById("countLabel").textContent = t("countLabel");
  document.getElementById("participantError").textContent = t("participantError");
  document.getElementById("locationSectionTitle").textContent = t("locationSectionTitle");
  document.getElementById("pincodeLabel").textContent = t("pincodeLabel");
  document.getElementById("pincode").placeholder = t("pincodePlaceholder");
  document.getElementById("pincodeHint").textContent = t("pincodeHint");
  document.getElementById("pincodeError").textContent = t("pincodeError");
  document.getElementById("accomSectionTitle").textContent = t("accomSectionTitle");
  document.getElementById("accomError").textContent = t("accomError");
  document.getElementById("submitBtn").textContent = t("submit");
  document.getElementById("footerText").textContent = t("footer");
  renderAccommodationOptions();
}

document.getElementById("pincode").addEventListener("blur", function(){
  prefetchLocation(this.value.trim());
});

function renderCountPills(){
  const container = document.getElementById("countPills");
  container.innerHTML = "";
  for(let i = 1; i <= MAX_PARTICIPANTS; i++){
    const button = document.createElement("button");
    button.type = "button";
    button.className = "count-pill" + (participantCount === i ? " selected" : "");
    button.textContent = String(i);
    button.addEventListener("click", function(){
      participantCount = i;
      renderCountPills();
      renderParticipantBlocks();
      document.getElementById("participantError").classList.remove("show");
    });
    container.appendChild(button);
  }
}

function renderParticipantBlocks(){
  const container = document.getElementById("participantBlocks");
  const existing = [];
  container.querySelectorAll(".person-card").forEach(function(card){
    existing.push({
      name: card.querySelector(".p-name").value,
      age: card.querySelector(".p-age").value,
      mobile: card.querySelector(".p-mobile").value,
      alternateMobile: card.querySelector(".p-alt-mobile") ? card.querySelector(".p-alt-mobile").value : "",
      gender: (card.querySelector('input[type="radio"]:checked') || {}).value || ""
    });
  });
  container.innerHTML = "";
  for(let i = 0; i < participantCount; i++){
    const value = existing[i] || { name: "", age: "", mobile: "", alternateMobile: "", gender: "" };
    const card = document.createElement("div");
    card.className = "person-card";
    card.innerHTML =
      '<div class="p-title">' + t("personTitle") + " " + (i + 1) + (i === 0 ? ' <span style="font-weight:500;color:#7a6a55;">' + escapeHtml(t("bookingPersonNote")) + "</span>" : "") + "</div>" +
      '<div class="person-grid">' +
        '<input type="text" class="p-name" placeholder="' + escapeHtml(t("namePlaceholder")) + '" value="' + escapeHtml(value.name) + '" required>' +
        '<input type="number" class="p-age" placeholder="' + escapeHtml(t("agePlaceholder")) + '" value="' + escapeHtml(value.age) + '" min="0" max="120" required>' +
        '<input type="tel" class="p-mobile" placeholder="' + escapeHtml(t("mobilePlaceholder")) + '" value="' + escapeHtml(value.mobile) + '" required>' +
      '</div>' +
      (i === 0 ? '<div style="margin-top:10px;"><input type="tel" class="p-alt-mobile" placeholder="' + escapeHtml(t("alternateMobilePlaceholder")) + '" value="' + escapeHtml(value.alternateMobile) + '" required></div>' : "") +
      '<div class="gender-group" style="margin-top:10px;">' +
        renderGenderOption(i, "male", t("genderMale"), value.gender === "male") +
        renderGenderOption(i, "female", t("genderFemale"), value.gender === "female") +
      "</div>";
    container.appendChild(card);
    attachCardEvents(card);
  }
}

function renderGenderOption(index, value, label, selected){
  return '<label class="gender-option' + (selected ? " selected" : "") + '">' +
    '<input type="radio" name="gender_' + index + '" value="' + value + '"' + (selected ? " checked" : "") + ">" +
    '<span class="option-text"><strong>' + escapeHtml(label) + "</strong></span>" +
  "</label>";
}

function attachCardEvents(card){
  card.querySelectorAll(".gender-option").forEach(function(option){
    option.addEventListener("click", function(){
      option.parentElement.querySelectorAll(".gender-option").forEach(function(item){ item.classList.remove("selected"); });
      option.classList.add("selected");
    });
  });
}

function renderAccommodationOptions(){
  const group = document.getElementById("accomGroup");
  const current = document.querySelector('input[name="accom"]:checked');
  const currentValue = current ? current.value : "";
  group.innerHTML =
    renderAccommodationOption("free", t("accomFreeTitle"), t("accomFreeHint"), currentValue === "free") +
    renderAccommodationOption("own", t("accomOwnTitle"), t("accomOwnHint"), currentValue === "own");
  group.querySelectorAll(".radio-option").forEach(function(option){
    option.addEventListener("click", function(){
      group.querySelectorAll(".radio-option").forEach(function(item){ item.classList.remove("selected"); });
      option.classList.add("selected");
      option.querySelector("input").checked = true;
      document.getElementById("field-accom").classList.remove("invalid");
    });
  });
}

function renderAccommodationOption(value, title, hint, selected){
  return '<label class="radio-option' + (selected ? " selected" : "") + '">' +
    '<input type="radio" name="accom" value="' + value + '"' + (selected ? " checked" : "") + ">" +
    '<span class="option-text"><strong>' + escapeHtml(title) + "</strong><span>" + escapeHtml(hint) + "</span></span>" +
  "</label>";
}

function validate(){
  let valid = true;
  const participantError = document.getElementById("participantError");
  participantError.classList.remove("show");

  if(participantCount < 1){
    participantError.classList.add("show");
    valid = false;
  }

  document.querySelectorAll(".person-card").forEach(function(card){
    const name = card.querySelector(".p-name");
    const age = card.querySelector(".p-age");
    const mobile = card.querySelector(".p-mobile");
    const alternateMobile = card.querySelector(".p-alt-mobile");
    const gender = card.querySelector('input[type="radio"]:checked');
    [name, age, mobile, alternateMobile].filter(Boolean).forEach(function(input){
      if(!input.value.trim()){
        input.style.borderColor = "#c0392b";
        valid = false;
      } else {
        input.style.borderColor = "";
      }
    });
    card.querySelectorAll(".gender-option").forEach(function(option){
      option.style.borderColor = "";
    });
    if(!gender){
      card.querySelectorAll(".gender-option").forEach(function(option){
        option.style.borderColor = "#c0392b";
      });
      valid = false;
    }
  });

  if(!valid && participantCount > 0) participantError.classList.add("show");

  const pinField = document.getElementById("field-pincode");
  const pinValue = document.getElementById("pincode").value.trim();
  if(!/^\d{6}$/.test(pinValue)){
    pinField.classList.add("invalid");
    valid = false;
  } else {
    pinField.classList.remove("invalid");
  }

  const accomField = document.getElementById("field-accom");
  const accomChecked = document.querySelector('input[name="accom"]:checked');
  if(!accomChecked){
    accomField.classList.add("invalid");
    valid = false;
  } else {
    accomField.classList.remove("invalid");
  }

  return valid;
}

function collectParticipants(){
  const participants = [];
  document.querySelectorAll(".person-card").forEach(function(card){
    participants.push({
      name: card.querySelector(".p-name").value.trim(),
      age: card.querySelector(".p-age").value.trim(),
      mobile: card.querySelector(".p-mobile").value.trim(),
      alternateMobile: card.querySelector(".p-alt-mobile") ? card.querySelector(".p-alt-mobile").value.trim() : "",
      gender: card.querySelector('input[type="radio"]:checked').value
    });
  });
  return participants;
}

function splitParticipantsByGender(participants){
  const result = { gents: [], ladies: [] };
  participants.forEach(function(person){
    const entry = {
      name: person.name,
      age: person.age,
      mobile: person.mobile,
      alternateMobile: person.alternateMobile || ""
    };
    if(person.gender === "male") result.gents.push(entry);
    if(person.gender === "female") result.ladies.push(entry);
  });
  return result;
}

function currentResolvedLocationFor(pincode){
  if(resolvedLocation && resolvedLocation._pincode === pincode){
    return {
      city: resolvedLocation.city || "",
      district: resolvedLocation.district || "",
      state: resolvedLocation.state || ""
    };
  }
  return { city: "", district: "", state: "" };
}

async function handleSubmit(event){
  event.preventDefault();
  if(!validate()) return;

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>' + escapeHtml(t("submitting"));

  const participants = collectParticipants();
  const grouped = splitParticipantsByGender(participants);
  const submissionId = "sub_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  const pincode = document.getElementById("pincode").value.trim();
  const requestTimestamp = new Date().toISOString();
  const payload = {
    participants: participants,
    gents: grouped.gents,
    ladies: grouped.ladies,
    gentsCount: grouped.gents.length,
    ladiesCount: grouped.ladies.length,
    pincode: pincode,
    accommodation: document.querySelector('input[name="accom"]:checked').value,
    timestamp: requestTimestamp,
    submissionId: submissionId,
    formLanguage: currentLanguage,
    location: currentResolvedLocationFor(pincode)
  };

  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(function(){ controller.abort(); }, REQUEST_TIMEOUT_MS);
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    const result = await response.json();
    if(result.status !== "success") throw new Error(result.message || "Submission failed");
    const bookingId = await resolveBookingId_(result, payload);
    showSuccess(participants.length, false, bookingId || result.submissionNumber || submissionId);
  }catch(error){
    const verification = await verifySubmission(submissionId, payload);
    if(verification.confirmed){
      showSuccess(participants.length, true, verification.bookingId || submissionId);
      return;
    }
    submitBtn.disabled = false;
    submitBtn.textContent = t("submit");
    showFailure();
  }
}

async function prefetchLocation(pincode){
  if(!/^\d{6}$/.test(pincode)) return resolvedLocation;
  if(resolvedLocation && resolvedLocation._pincode === pincode) return resolvedLocation;
  try{
    const response = await fetch("https://api.postalpincode.in/pincode/" + encodeURIComponent(pincode));
    const payload = await response.json();
    const office = payload && payload[0] && payload[0].Status === "Success" && payload[0].PostOffice && payload[0].PostOffice[0];
    resolvedLocation = office ? {
      city: office.District || office.Block || office.Name || "",
      district: office.District || "",
      state: office.State || "",
      _pincode: pincode
    } : { city: "", district: "", state: "", _pincode: pincode };
  }catch(error){
    resolvedLocation = { city: "", district: "", state: "", _pincode: pincode };
  }
  return resolvedLocation;
}

async function verifySubmission(submissionId, payload){
  for(let attempt = 0; attempt < 4; attempt++){
    try{
      const response = await fetch(SCRIPT_URL + "?action=getSubmissionStatus&submissionId=" + encodeURIComponent(submissionId));
      const result = await response.json();
      if(Boolean(result && result.status === "success" && result.data && result.data.exists)) {
        return { confirmed: true, bookingId: result.data.submissionNumber || "" };
      }
      if(Boolean(result && result.status === "ok")) {
        const fallback = await verifySubmissionFromAllData(submissionId, payload);
        if(fallback.confirmed) return fallback;
      }
    }catch(error){
      const fallback = await verifySubmissionFromAllData(submissionId, payload);
      if(fallback.confirmed) return fallback;
    }
    await wait(1200);
  }
  return { confirmed: false, bookingId: "" };
}

async function verifySubmissionFromAllData(submissionId, payload){
  try{
    const response = await fetch(SCRIPT_URL + "?action=getAllData");
    const result = await response.json();
    if(!result || result.status !== "success" || !Array.isArray(result.data)) return { confirmed: false, bookingId: "" };

    const expectedTimestamp = String(payload && payload.timestamp || "");
    const expectedPincode = String(payload && payload.pincode || "");
    const expectedPeople = Array.isArray(payload && payload.participants) ? payload.participants : [];
    const firstPerson = expectedPeople[0] || {};
    const firstName = String(firstPerson.name || "").trim().toLowerCase();
    const firstMobile = String(firstPerson.mobile || "").trim();

    const directMatch = result.data.find(function(row){
      return String(row["Submission ID"] || "") === String(submissionId);
    });
    if(directMatch) {
      return { confirmed: true, bookingId: String(directMatch["Submission Number"] || "") };
    }

    const matchedRows = result.data.filter(function(row){
      const rowTimestamp = String(row["Timestamp"] || "");
      const rowPincode = String(row["PIN Code"] || "");
      const rowName = String(row["Name"] || "").trim().toLowerCase();
      const rowMobile = String(row["Mobile Number"] || "").trim();
      return rowTimestamp === expectedTimestamp && rowPincode === expectedPincode && rowName === firstName && rowMobile === firstMobile;
    });

    if(matchedRows.length >= expectedPeople.length && expectedPeople.length > 0) {
      return { confirmed: true, bookingId: String(matchedRows[0]["Submission Number"] || "") };
    }
    return { confirmed: false, bookingId: "" };
  }catch(error){
    return { confirmed: false, bookingId: "" };
  }
}

async function resolveBookingId_(result, payload){
  if(result && result.submissionNumber) return String(result.submissionNumber);
  const serverSubmissionId = String(result && result.submissionId || "");
  const verification = await verifySubmission(serverSubmissionId || payload.submissionId, payload);
  return verification.bookingId || "";
}

function showSuccess(count, verifiedAfterRetry, submissionId){
  document.querySelector("form").style.display = "none";
  const statusBox = document.getElementById("statusBox");
  statusBox.classList.add("show");
  statusBox.classList.remove("error");
  document.getElementById("statusIcon").textContent = "✓";
  document.getElementById("statusTitle").textContent = t("successTitle");
  document.getElementById("statusMsg").textContent = formatMessage(
    verifiedAfterRetry ? t("successMessageRetry") : t("successMessage"),
    { count: count, submissionId: submissionId }
  );
}

function showFailure(){
  const statusBox = document.getElementById("statusBox");
  statusBox.classList.add("show", "error");
  document.getElementById("statusIcon").textContent = "✕";
  document.getElementById("statusTitle").textContent = t("failureTitle");
  document.getElementById("statusMsg").textContent = t("failureMessage");
  setTimeout(function(){
    statusBox.classList.remove("show", "error");
  }, 3500);
}

function wait(ms){
  return new Promise(function(resolve){
    setTimeout(resolve, ms);
  });
}

function formatMessage(template, values){
  return template.replace(/\{(\w+)\}/g, function(_, key){
    return values[key] !== undefined ? values[key] : "";
  });
}

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
