<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shripad Shrivallabh Charitamrut Samohik Parayan- 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --saffron:#e2711d;
    --saffron-dark:#c85a0e;
    --maroon:#7a2e2e;
    --cream:#fff8ee;
    --ink:#332218;
    --border:#e8d9c0;
    --success:#2f7d4f;
    --error:#c0392b;
    --info:#2f6fa8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;max-width:100%;overflow-x:hidden;}
  body{font-family:'Poppins','Noto Sans Devanagari',sans-serif;background:linear-gradient(180deg,#fff8ee 0%,#fbeed9 100%);color:var(--ink);min-height:100vh;}
  .page{padding:0 0 60px;}
  .language-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top left,rgba(226,113,29,.18),transparent 40%),radial-gradient(circle at bottom right,rgba(122,46,46,.16),transparent 38%),linear-gradient(180deg,#fff8ee 0%,#fbe7c6 100%);}
  .language-card{width:min(100%,760px);background:rgba(255,255,255,.95);border:1px solid rgba(232,217,192,.9);border-radius:28px;box-shadow:0 22px 56px rgba(122,46,46,.14);padding:28px;text-align:center;}
  .language-title{font-family:'Noto Serif','Noto Sans Devanagari',serif;font-size:clamp(28px,5vw,44px);color:var(--maroon);margin:0 0 12px;line-height:1.15;}
  .language-subtitle{margin:0 0 28px;font-size:clamp(16px,2.6vw,20px);color:#7a6a55;}
  .language-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  .language-btn{border:none;cursor:pointer;width:100%;min-height:180px;border-radius:22px;padding:24px 20px;font:inherit;transition:transform .14s ease,box-shadow .14s ease;box-shadow:0 12px 30px rgba(122,46,46,.1);}
  .language-btn:hover{transform:translateY(-2px);}
  .language-btn.marathi{background:linear-gradient(135deg,#7a2e2e,#9e4c2e);color:#fff7ea;}
  .language-btn.english{background:linear-gradient(135deg,#e2711d,#f1a349);color:#fffaf3;}
  .language-btn .big{display:block;font-size:clamp(26px,5vw,40px);font-weight:700;margin-bottom:10px;}
  .language-btn .small{display:block;font-size:clamp(15px,2.8vw,20px);opacity:.95;}
  header{background:linear-gradient(120deg,var(--maroon),#5c2020);color:#fdf1df;padding:28px 20px 34px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.15);}
  header h1{font-family:'Noto Serif','Noto Sans Devanagari',serif;font-size:clamp(20px,4vw,30px);margin:0 0 8px;line-height:1.3;}
  header p{margin:0;font-size:clamp(14px,2.8vw,16px);color:#f3d9b0;}
  .dates{display:inline-block;margin-top:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);padding:6px 16px;border-radius:999px;font-size:14px;letter-spacing:.2px;}
  .container{width:min(100%,760px);margin:-20px auto 0;padding:0 16px;}
  form{background:#fffefb;border-radius:18px;box-shadow:0 10px 30px rgba(122,46,46,.12);padding:clamp(18px,4vw,34px);margin-top:20px;}
  .section{margin-bottom:28px;}
  .section-title{font-size:16px;font-weight:700;color:var(--saffron-dark);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--border);}
  .field{margin-bottom:18px;position:relative;}
  label{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px;color:var(--ink);}
  .req{color:var(--saffron-dark);}
  .hint{font-size:12px;color:#a3906f;margin-top:5px;}
  input[type="text"],input[type="tel"],input[type="number"]{width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--border);border-radius:10px;background:#fffdf9;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s;appearance:none;}
  input:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 3px rgba(226,113,29,.15);}
  .count-pills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
  .count-pill{min-height:52px;border-radius:12px;border:1.5px solid var(--border);background:#fffdf9;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;}
  .count-pill:hover{border-color:var(--saffron);}
  .count-pill.selected{background:var(--saffron);border-color:var(--saffron);color:#fff;}
  .person-blocks{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
  .person-card{background:var(--cream);border:1.5px solid var(--border);border-radius:14px;padding:14px;}
  .person-card.primary{background:linear-gradient(180deg,#fff4df 0%,#fff9f0 100%);border-color:#e8b36d;box-shadow:0 8px 18px rgba(226,113,29,.12);}
  .p-title{font-weight:700;font-size:14px;color:var(--maroon);margin-bottom:10px;}
  .p-note{display:block;margin-top:4px;font-size:12px;font-weight:500;color:#7a6a55;}
  .person-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .gender-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .gender-option,.radio-option{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;background:#fffdf9;}
  .gender-option:hover,.radio-option:hover{border-color:var(--saffron);}
  .gender-option.selected,.radio-option.selected{border-color:var(--saffron);background:#fff3e4;}
  .gender-option input,.radio-option input{margin-top:2px;accent-color:var(--saffron-dark);width:18px;height:18px;flex-shrink:0;}
  .radio-group{display:flex;flex-direction:column;gap:10px;}
  .option-text strong{display:block;font-size:14.5px;}
  .option-text span{font-size:12.5px;color:#7a6a55;}
  .submit-btn{width:100%;padding:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--saffron),var(--saffron-dark));border:none;border-radius:12px;cursor:pointer;box-shadow:0 6px 16px rgba(226,113,29,.35);}
  .submit-btn:disabled{opacity:.65;cursor:not-allowed;}
  .inline-error,.error-text{color:var(--error);font-size:12.5px;margin-top:8px;display:none;}
  .inline-error.show,.error-text.show{display:block;}
  .field.invalid input,.field.invalid .gender-option,.field.invalid .radio-option{border-color:var(--error);}
  .availability-card{background:#fff8ee;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;}
  .availability-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .availability-item{border-radius:12px;padding:12px 14px;background:#fffdf9;border:1px solid var(--border);}
  .availability-item strong{display:block;color:var(--maroon);font-size:14px;}
  .availability-item span{display:block;margin-top:4px;font-size:13px;color:#6b5a45;}
  .availability-item.full{border-color:#e2b3b3;background:#fff4f4;}
  .availability-status{font-size:12.5px;color:#6b5a45;margin-top:8px;}
  .suggestions{position:absolute;top:100%;left:0;right:0;z-index:10;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.12);max-height:280px;overflow:auto;display:none;}
  .suggestions.show{display:block;}
  .suggestion{padding:11px 14px;border-bottom:1px solid #f1e4cf;cursor:pointer;}
  .suggestion:last-child{border-bottom:none;}
  .suggestion.active,.suggestion:hover{background:#fff4e5;}
  .suggestion strong{display:block;font-size:14px;color:var(--ink);}
  .suggestion span{font-size:12px;color:#7a6a55;}
  .location-meta{margin-top:8px;font-size:12.5px;color:#6b5a45;}
  .location-meta strong{color:var(--success);}
  .location-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;}
  .link-btn{border:none;background:none;padding:0;color:var(--info);font:inherit;font-weight:600;cursor:pointer;}
  .manual-location{display:none;padding:14px;border:1px dashed var(--border);border-radius:12px;background:#fffaf4;margin-top:12px;}
  .manual-location.show{display:block;}
  .manual-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .attribution{font-size:11.5px;color:#8a7454;margin-top:8px;}
  #statusBox{display:none;text-align:center;padding:40px 20px;}
  #statusBox.show{display:block;}
  #statusBox.error #statusIcon{color:var(--error);}
  #statusIcon{font-size:52px;margin-bottom:14px;color:var(--success);}
  #statusBox h2{font-family:'Noto Serif','Noto Sans Devanagari',serif;margin-bottom:8px;}
  #statusBox p{color:#6b5a45;font-size:14.5px;word-break:break-word;}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .page-footer{width:min(100%,760px);margin:24px auto 0;padding:0 16px;}
  .footer-card{background:#fffaf3;border:1px solid var(--border);border-radius:16px;padding:18px;color:#7a6a55;}
  .footer-note{text-align:center;font-size:12px;margin-top:14px;}
  .contact-title{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--maroon);}
  .contact-grid{display:grid;grid-template-columns:1fr;gap:10px 18px;}
  .contact-item{font-size:13.5px;color:var(--ink);}
  .contact-item a{color:var(--saffron-dark);text-decoration:none;font-weight:600;}
  .contact-item a:hover{text-decoration:underline;}
  .validation-modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;}
  .validation-modal.show{display:flex;}
  .validation-card{width:min(100%,520px);max-height:min(80vh,640px);overflow:auto;background:#fffefb;border-radius:18px;padding:20px;box-shadow:0 18px 46px rgba(0,0,0,.24);}
  .validation-card h3{margin:0 0 8px;color:var(--maroon);font-size:20px;}
  .validation-card p{margin:0 0 14px;color:#6b5a45;font-size:14px;}
  .validation-list{margin:0;padding-left:18px;color:var(--ink);font-size:14px;}
  .validation-list li+li{margin-top:8px;}
  .validation-actions{display:flex;justify-content:flex-end;margin-top:18px;}
  @media (min-width:640px){
    .language-grid{grid-template-columns:1fr 1fr;}
    .person-grid{grid-template-columns:2fr 1fr 1.3fr;}
    .contact-grid,.availability-grid,.manual-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:480px){
    header{padding:24px 14px 30px;}
    form{padding:18px 14px;}
    .language-card{padding:20px 16px;}
    .language-btn{min-height:160px;}
    .count-pills{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
</style>
</head>
<body>
<div id="languageScreen" class="language-screen">
  <div class="language-card">
    <h1 class="language-title" id="languageTitle"></h1>
    <p class="language-subtitle" id="languageSubtitle"></p>
    <div class="language-grid">
      <button type="button" class="language-btn marathi" data-language="mr">
        <span class="big" id="languageMarathiTitle"></span>
        <span class="small" id="languageMarathiText"></span>
      </button>
      <button type="button" class="language-btn english" data-language="en">
        <span class="big" id="languageEnglishTitle"></span>
        <span class="small" id="languageEnglishText"></span>
      </button>
    </div>
  </div>
</div>

<div id="app" class="page" style="display:none;">
  <header>
    <h1 id="headerTitle"></h1>
    <p id="headerSubtitle"></p>
    <div class="dates" id="headerDates"></div>
  </header>
  <div class="container">
    <form id="regForm" novalidate>
      <div class="availability-card">
        <div class="section-title" id="availabilityTitle"></div>
        <div class="availability-grid">
          <div class="availability-item" id="availabilityFree"><strong id="availabilityFreeTitle"></strong><span id="availabilityFreeText"></span></div>
          <div class="availability-item" id="availabilityOwn"><strong id="availabilityOwnTitle"></strong><span id="availabilityOwnText"></span></div>
        </div>
        <div class="availability-status" id="availabilityStatus"></div>
      </div>

      <div id="formBody">
        <div class="section">
          <div class="section-title" id="countSectionTitle"></div>
          <div class="field">
            <label id="countLabel"></label>
            <div class="count-pills" id="countPills"></div>
          </div>
          <div class="person-blocks" id="participantBlocks"></div>
          <div class="inline-error" id="participantError"></div>
        </div>

        <div class="section">
          <div class="section-title" id="locationSectionTitle"></div>
          <div class="field" id="field-location">
            <label id="locationLabel" for="locationSearch"></label>
            <input type="text" id="locationSearch" autocomplete="off">
            <div class="suggestions" id="locationSuggestions"></div>
            <div class="hint" id="locationHint"></div>
            <div class="location-meta" id="locationMeta"></div>
            <div class="location-actions">
              <button type="button" class="link-btn" id="manualLocationBtn"></button>
            </div>
            <div class="error-text" id="locationError"></div>
            <div class="manual-location" id="manualLocationFields">
              <div class="manual-grid">
                <div class="field" id="field-manual-area">
                  <label id="manualAreaLabel" for="manualArea"></label>
                  <input type="text" id="manualArea">
                </div>
                <div class="field" id="field-manual-city">
                  <label id="manualCityLabel" for="manualCity"></label>
                  <input type="text" id="manualCity">
                </div>
                <div class="field" id="field-manual-district">
                  <label id="manualDistrictLabel" for="manualDistrict"></label>
                  <input type="text" id="manualDistrict">
                </div>
                <div class="field" id="field-manual-state">
                  <label id="manualStateLabel" for="manualState"></label>
                  <input type="text" id="manualState">
                </div>
                <div class="field" id="field-manual-postcode">
                  <label id="manualPostcodeLabel" for="manualPostcode"></label>
                  <input type="text" id="manualPostcode" inputmode="numeric" maxlength="6">
                </div>
              </div>
            </div>
            <div class="attribution" id="locationAttribution"></div>
          </div>
        </div>

        <div class="section">
          <div class="section-title" id="accomSectionTitle"></div>
          <div class="field" id="field-accom">
            <div class="radio-group" id="accomGroup"></div>
            <div class="error-text" id="accomError"></div>
          </div>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn"></button>
    </form>

    <div id="statusBox">
      <div id="statusIcon">✓</div>
      <h2 id="statusTitle"></h2>
      <p id="statusMsg"></p>
    </div>
  </div>
</div>

<div class="page-footer">
  <div class="footer-card">
    <h2 class="contact-title" id="contactTitle"></h2>
    <div class="contact-grid">
      <div class="contact-item">Prasad Bhivre - <a href="tel:9673462498">9673462498</a></div>
      <div class="contact-item">Priyanka Tai Patil - <a href="tel:9552192169">9552192169</a></div>

    </div>
    <div class="footer-note" id="footerText"></div>
  </div>
</div>

<div id="validationModal" class="validation-modal" role="dialog" aria-modal="true" aria-labelledby="validationTitle">
  <div class="validation-card">
    <h3 id="validationTitle"></h3>
    <p id="validationIntro"></p>
    <ul id="validationList" class="validation-list"></ul>
    <div class="validation-actions">
      <button type="button" class="submit-btn" id="closeValidationBtn" style="width:auto;padding:12px 16px;"></button>
    </div>
  </div>
</div>

function renderAccommodationOptions(){
  const group = document.getElementById("accomGroup");
  const current = document.querySelector('input[name="accom"]:checked');
  const currentValue = current ? current.value : "";
  group.innerHTML =
    renderAccommodationOption("free", t("accomFreeTitle"), t("accomFreeHint"), currentValue === "free") +
    renderAccommodationOption("own", t("accomOwnTitle"), t("accomOwnHint"), currentValue === "own");

      renderAvailability();

function renderAccommodationOption(value, title, hint, selected){
  const availability = availabilityData && availabilityData[value];
  const isFull = availability && availability.remaining <= 0;
  const detailText = isFull ? t("availabilityFull") : hint;
  return '<label class="radio-option' + (selected ? " selected" : "") + (isFull ? ' field invalid' : "") + '" data-disabled="' + (isFull ? "true" : "false") + '">' +
    '<input type="radio" name="accom" value="' + value + '"' + (selected ? " checked" : "") + (isFull ? " disabled" : "") + ">" +
    '<span class="option-text"><strong>' + escapeHtml(title) + "</strong><span>" + escapeHtml(detailText) + "</span></span>" +
  "</label>";
}

async function loadAvailability(){
  document.getElementById("availabilityStatus").textContent = t("availabilityLoading");
  try {
    const response = await fetch(SCRIPT_URL + "?action=getAvailability&_=" + Date.now());
    const payload = await response.json();
    if (payload.status !== "success") throw new Error(payload.message || "Availability failed");
    availabilityData = payload.data || null;
    renderAccommodationOptions();
    renderAvailability();
  } catch (error) {
    availabilityData = null;
    renderAvailability();
    document.getElementById("availabilityStatus").textContent = t("availabilityError");
  }
}

function renderAvailability(){
  const freeBox = document.getElementById("availabilityFree");
  const ownBox = document.getElementById("availabilityOwn");
  const status = document.getElementById("availabilityStatus");
  if (!availabilityData) {
    document.getElementById("availabilityFreeText").textContent = "-";
    document.getElementById("availabilityOwnText").textContent = "-";
    freeBox.classList.remove("full");
    ownBox.classList.remove("full");
    return;
  }
  ["free", "own"].forEach(function(key){
    const box = document.getElementById(key === "free" ? "availabilityFree" : "availabilityOwn");
    const text = document.getElementById(key === "free" ? "availabilityFreeText" : "availabilityOwnText");
    const item = availabilityData[key];
    text.textContent = item.remaining <= 0 ? t("availabilityFull") : formatMessage(t("availabilityPattern"), item);
    box.classList.toggle("full", item.remaining <= 0);
  });
  const selectedAccommodation = document.querySelector('input[name="accom"]:checked');
  if (selectedAccommodation && availabilityData[selectedAccommodation.value] && participantCount > availabilityData[selectedAccommodation.value].remaining) {
    const accomLabel = selectedAccommodation.value === "free" ? t("availabilityFreeTitle") : t("availabilityOwnTitle");
    status.textContent = formatMessage(t("errorCapacityExceeded"), {
      remaining: availabilityData[selectedAccommodation.value].remaining,
      accommodation: accomLabel
    });
  } else {
    status.textContent = "";
  }
}

function handleLocationInput(event){
  const query = event.target.value.trim();
  selectedLocation = null;
  updateLocationMeta();
  if (locationDebounceId) clearTimeout(locationDebounceId);
  if (locationAbortController) locationAbortController.abort();
  if (query.length < 3) {
    hideSuggestions();
    if (query.length === 0) manualLocationVisible = false;
    renderManualLocation();
    return;
  }
  locationDebounceId = setTimeout(function(){
    searchLocationSuggestions(query);
  }, 450);
}

function handleLocationKeydown(event){
  if (!currentSuggestions.length) return;
  if (event.key === "ArrowDown") {
    event.preventDefault();
    activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, currentSuggestions.length - 1);
    renderSuggestions();
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
    renderSuggestions();
  } else if (event.key === "Enter" && activeSuggestionIndex >= 0) {
    event.preventDefault();
    chooseSuggestion(currentSuggestions[activeSuggestionIndex]);
  } else if (event.key === "Escape") {
    hideSuggestions();
  }
}

async function searchLocationSuggestions(query){
  const statusEl = document.getElementById("locationError");
  statusEl.classList.remove("show");
  currentSuggestions = [];
  activeSuggestionIndex = -1;
  if (locationCache.has(query)) {
    currentSuggestions = locationCache.get(query);
    renderSuggestions();
    return;
  }
  document.getElementById("locationSuggestions").innerHTML = '<div class="suggestion"><strong>' + escapeHtml(t("locationLoading")) + "</strong></div>";
  document.getElementById("locationSuggestions").classList.add("show");
  locationAbortController = new AbortController();
  try {
    const params = new URLSearchParams({
      q: query,
      limit: "10",
      bbox: PHOTON_BBOX.join(",")
    });
    const response = await fetch(PHOTON_URL + "?" + params.toString(), { signal: locationAbortController.signal });
    const payload = await response.json();
    const suggestions = normalizePhotonResults(payload && payload.features ? payload.features : []);
    locationCache.set(query, suggestions);
    currentSuggestions = suggestions;
    renderSuggestions();
    if (!suggestions.length) {
      document.getElementById("locationSuggestions").innerHTML = '<div class="suggestion"><strong>' + escapeHtml(t("locationNoResults")) + "</strong></div>";
      document.getElementById("locationSuggestions").classList.add("show");
    }
  } catch (error) {
    if (error.name === "AbortError") return;
    manualLocationVisible = true;
    renderManualLocation();
    document.getElementById("locationError").textContent = t("locationSearchError");
    document.getElementById("locationError").classList.add("show");
    hideSuggestions();
  }
}

function normalizePhotonResults(features){
  const seen = new Set();
  return features.map(function(feature){
    const props = feature.properties || {};
    const countryCode = String(props.countrycode || "").toLowerCase();
    const country = String(props.country || "").toLowerCase();
    if (countryCode !== "in" && country !== "india") return null;
    const area = firstNonEmpty([props.name, props.suburb, props.street, props.locality, props.district]);
    const city = firstNonEmpty([props.city, props.town, props.county, props.state_district, props.district, props.village]);
    const district = firstNonEmpty([props.district, props.county, props.state_district, city]);
    const state = firstNonEmpty([props.state]);
    if (!area || !city || !state) return null;
    const postcode = String(props.postcode || "").trim();
    const key = [area, city, district, state, postcode].join("|").toLowerCase();
    if (seen.has(key)) return null;
    seen.add(key);
    return {
      area: area,
      city: city,
      district: district,
      state: state,
      postcode: postcode,
      label: area + ", " + city + ", " + state
    };
  }).filter(Boolean);
}

function renderSuggestions(){
  const box = document.getElementById("locationSuggestions");
  if (!currentSuggestions.length) {
    hideSuggestions();
    return;
  }
  box.innerHTML = currentSuggestions.map(function(item, index){
    return '<div class="suggestion' + (index === activeSuggestionIndex ? " active" : "") + '" data-index="' + index + '">' +
      "<strong>" + escapeHtml(item.area) + "</strong>" +
      "<span>" + escapeHtml(item.city + ", " + item.state + (item.postcode ? " " + item.postcode : "")) + "</span>" +
      "</div>";
  }).join("");
  box.classList.add("show");
  box.querySelectorAll(".suggestion").forEach(function(item){
    item.addEventListener("mousedown", function(event){
      event.preventDefault();
      chooseSuggestion(currentSuggestions[Number(item.dataset.index)]);
    });
  });
}

function renderManualLocation(){

function updateLocationMeta(){

function getResolvedLocation(){
  if (selectedLocation && !manualLocationVisible) {
    return {
      area: selectedLocation.area,
      city: selectedLocation.city,
      district: selectedLocation.district,
      state: selectedLocation.state,
      postcode: selectedLocation.postcode
    };
  }
  return {
    area: document.getElementById("manualArea").value.trim(),
    city: document.getElementById("manualCity").value.trim(),
    district: document.getElementById("manualDistrict").value.trim() || document.getElementById("manualCity").value.trim(),
    state: document.getElementById("manualState").value.trim(),
    postcode: document.getElementById("manualPostcode").value.trim()
  };
}

function validate(){
  const errors = [];
  let firstInvalidField = null;

  function pushError(message, element){
    errors.push(message);
    if (!firstInvalidField && element) firstInvalidField = element;
  }

  if (participantCount < 1) {
    pushError(t("errorParticipantCount"), document.getElementById("countPills"));
  }

  document.querySelectorAll(".person-card").forEach(function(card, index){
    const personNo = index + 1;
    const name = card.querySelector(".p-name");
    const age = card.querySelector(".p-age");
    const mobile = card.querySelector(".p-mobile");
    const gender = card.querySelector('input[type="radio"]:checked');

    resetFieldState(name);
    resetFieldState(age);
    resetFieldState(mobile);
    card.querySelectorAll(".gender-option").forEach(function(option){ option.style.borderColor = ""; });

    if (!name.value.trim()) {
      markInvalidField(name);
      pushError(formatMessage(t("errorNameRequired"), { index: personNo }), name);
    }
    if (!age.value.trim()) {
      markInvalidField(age);
      pushError(formatMessage(t("errorAgeRequired"), { index: personNo }), age);
    } else if (!AGE_REGEX.test(age.value.trim())) {
      markInvalidField(age);
      pushError(formatMessage(t("errorAgeInvalid"), { index: personNo }), age);
    }
    if (!mobile.value.trim()) {
      markInvalidField(mobile);
      pushError(formatMessage(t("errorMobileRequired"), { index: personNo }), mobile);
    } else if (!MOBILE_REGEX.test(mobile.value.trim())) {
      markInvalidField(mobile);
      pushError(formatMessage(t("errorMobileInvalid"), { index: personNo }), mobile);
    }
    if (!gender) {
      card.querySelectorAll(".gender-option").forEach(function(option){ option.style.borderColor = "#c0392b"; });
      pushError(formatMessage(t("errorGenderRequired"), { index: personNo }), card.querySelector(".gender-group"));
    }
  });

  const location = getResolvedLocation();
  const locationField = document.getElementById("field-location");
  locationField.classList.remove("invalid");
  document.getElementById("locationError").classList.remove("show");
  if (!selectedLocation && !manualLocationVisible) {
    locationField.classList.add("invalid");
    document.getElementById("locationError").textContent = t("errorLocationRequired");
    document.getElementById("locationError").classList.add("show");
    pushError(t("errorLocationRequired"), document.getElementById("locationSearch"));
  }
  if (manualLocationVisible) {
    ["manualArea", "manualCity", "manualState", "manualPostcode"].forEach(function(id){
      resetFieldState(document.getElementById(id));
    });
    if (!location.area) {
      markInvalidField(document.getElementById("manualArea"));
      pushError(t("errorManualAreaRequired"), document.getElementById("manualArea"));
    }
    if (!location.city) {
      markInvalidField(document.getElementById("manualCity"));
      pushError(t("errorManualCityRequired"), document.getElementById("manualCity"));
    }
    if (!location.state) {
      markInvalidField(document.getElementById("manualState"));
      pushError(t("errorManualStateRequired"), document.getElementById("manualState"));
    }
    if (location.postcode && !POSTCODE_REGEX.test(location.postcode)) {
      markInvalidField(document.getElementById("manualPostcode"));
      pushError(t("errorManualPostcodeInvalid"), document.getElementById("manualPostcode"));
    }
  }

  const accomField = document.getElementById("field-accom");
  const accomChecked = document.querySelector('input[name="accom"]:checked');
  accomField.classList.remove("invalid");
  if (!accomChecked) {
    accomField.classList.add("invalid");
    pushError(t("errorAccommodationRequired"), document.getElementById("accomGroup"));
  } else if (availabilityData && availabilityData[accomChecked.value] && participantCount > availabilityData[accomChecked.value].remaining) {
    const accomLabel = accomChecked.value === "free" ? t("availabilityFreeTitle") : t("availabilityOwnTitle");
    accomField.classList.add("invalid");
    pushError(formatMessage(t("errorCapacityExceeded"), {
      remaining: availabilityData[accomChecked.value].remaining,
      accommodation: accomLabel
    }), document.getElementById("accomGroup"));
  }

  return { isValid: errors.length === 0, errors: errors, firstInvalidField: firstInvalidField };
}

function collectParticipants(){
  return Array.from(document.querySelectorAll(".person-card")).map(function(card){
    return {
      name: card.querySelector(".p-name").value.trim(),
      age: card.querySelector(".p-age").value.trim(),
      mobile: card.querySelector(".p-mobile").value.trim(),
      gender: card.querySelector('input[type="radio"]:checked').value
    };
  });
}

async function handleSubmit(event){
  event.preventDefault();
  const validation = validate();
  if (!validation.isValid) {
    showValidationModal(validation.errors, validation.firstInvalidField);
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>' + escapeHtml(t("submitting"));

  const participants = collectParticipants();
  const submissionId = "sub_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  const requestTimestamp = new Date().toISOString();
  const payload = {
    participants: participants,
    accommodation: document.querySelector('input[name="accom"]:checked').value,
    timestamp: requestTimestamp,
    submissionId: submissionId,
    formLanguage: currentLanguage,
    location: getResolvedLocation()
  };

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(function(){ controller.abort(); }, REQUEST_TIMEOUT_MS);
    let response;
    try {
      response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeoutId);
    }
    const result = await response.json();
    if (result.status !== "success") throw new Error(result.message || "Submission failed");
    const bookingId = String(result.submissionNumber || "");
    if (!bookingId) throw new Error("Missing submission number");
    await loadAvailability();
    showSuccess(participants.length, false, bookingId);
  } catch (error) {
    const verification = await verifySubmission(submissionId);
    if (verification.confirmed) {
      await loadAvailability();
      showSuccess(participants.length, true, verification.bookingId);
      return;
    }
    submitBtn.disabled = false;
    submitBtn.textContent = t("submit");
    showFailure(error && error.message ? error.message : t("failureMessage"));
  }
}

async function verifySubmission(submissionId){
  for (let attempt = 0; attempt < VERIFY_ATTEMPTS; attempt++) {
    try {
      const response = await fetch(SCRIPT_URL + "?action=getSubmissionStatus&submissionId=" + encodeURIComponent(submissionId) + "&_=" + Date.now());
      const result = await response.json();
      if (result && result.status === "success" && result.data && result.data.exists) {
        return { confirmed: true, bookingId: String(result.data.submissionNumber || "") };
      }
    } catch (error) {}
    if (attempt < VERIFY_ATTEMPTS - 1) await wait(VERIFY_WAIT_MS);
  }
  return { confirmed: false, bookingId: "" };
}

function showSuccess(count, verifiedAfterRetry, bookingId){
  document.querySelector("form").style.display = "none";
  const statusBox = document.getElementById("statusBox");
  statusBox.classList.add("show");
  statusBox.classList.remove("error");
  document.getElementById("statusIcon").textContent = "✓";
  document.getElementById("statusTitle").textContent = t("successTitle");
  document.getElementById("statusMsg").textContent = formatMessage(
    verifiedAfterRetry ? t("successMessageRetry") : t("successMessage"),
    { count: count, bookingId: bookingId }
  );
}

function showFailure(message){
  const statusBox = document.getElementById("statusBox");
  statusBox.classList.add("show", "error");
  document.getElementById("statusIcon").textContent = "✕";
  document.getElementById("statusTitle").textContent = t("failureTitle");
  document.getElementById("statusMsg").textContent = message || t("failureMessage");
  setTimeout(function(){
    statusBox.classList.remove("show", "error");
  }, 3500);
}

function showValidationModal(errors, firstInvalidField){
  validationFocusTarget = firstInvalidField || null;
  const list = document.getElementById("validationList");
  list.innerHTML = "";
  errors.forEach(function(message){
    const item = document.createElement("li");
    item.textContent = message;
    list.appendChild(item);
  });
  document.getElementById("validationModal").classList.add("show");
}

function closeValidationModal(){
  document.getElementById("validationModal").classList.remove("show");
  if (validationFocusTarget && typeof validationFocusTarget.scrollIntoView === "function") {
    validationFocusTarget.scrollIntoView({ behavior: "smooth", block: "center" });
    if (typeof validationFocusTarget.focus === "function") validationFocusTarget.focus({ preventScroll: true });
  }
}

function markInvalidField(element){
  if (element) element.style.borderColor = "#c0392b";
}

function resetFieldState(element){
  if (element) element.style.borderColor = "";
}

function firstNonEmpty(values){
  for (let i = 0; i < values.length; i++) {
    const value = String(values[i] || "").trim();
    if (value) return value;
  }
  return "";
}

function wait(ms){
  return new Promise(function(resolve){ setTimeout(resolve, ms); });
}

function formatMessage(template, values){
  return String(template).replace(/\{(\w+)\}/g, function(_, key){
    return values[key] !== undefined ? values[key] : "";
  });
}

function escapeHtml(value){
  return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
</script>
