<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Registration - Shripad Shrivallabh Charitamrut Samohik Parayan- 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#8c3a14;
    --primary-dark:#67280d;
    --accent:#d9822b;
    --bg:#fff5ea;
    --card:#ffffff;
    --ink:#2f241d;
    --border:#edd4bc;
    --error:#b33a30;
    --success:#2f7d4f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins','Noto Sans Devanagari',sans-serif;background:linear-gradient(180deg,#fff7ef 0%,#f8e3cf 100%);color:var(--ink);}
  .shell{min-height:100vh;padding:20px;}
  .gate,.panel{width:min(100%,780px);margin:0 auto;background:rgba(255,255,255,.98);border:1px solid var(--border);border-radius:24px;box-shadow:0 20px 48px rgba(103,40,13,.12);}
  .gate{max-width:460px;margin-top:60px;padding:28px;}
  .lang-switch{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;}
  .lang-btn{padding:8px 12px;border-radius:999px;background:#f7eadb;color:var(--primary-dark);font-weight:700;}
  .lang-btn.active{background:var(--primary);color:#fff;}
  .gate h1,.header h1{font-family:'Noto Serif','Noto Sans Devanagari',serif;margin:0 0 10px;color:var(--primary-dark);}
  .header h1{color:#ffe072;}
  .sub{color:#4b3a2f;font-size:14px;margin-bottom:18px;}
  input[type="text"],input[type="tel"],input[type="number"]{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font:inherit;background:#fbfeff;color:var(--ink);}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,95,116,.12);}
  button{font:inherit;border:none;cursor:pointer;}
  .btn{width:100%;padding:14px 16px;border-radius:12px;background:linear-gradient(120deg,#a3471c,#6b1f12);color:#fff;font-weight:700;}
  .btn.secondary{background:#f6e7d7;color:var(--primary-dark);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .panel{display:none;margin-top:20px;overflow:hidden;}
  .header{background:linear-gradient(120deg,#6b1f12,#a3471c);padding:24px 24px 28px;color:#ffe072;text-align:center;}
  .header p{margin:0;color:#ffe9a8;}
  .header-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .content{padding:24px;}
  .section{margin-bottom:28px;}
  .section-title{font-size:16px;font-weight:700;color:var(--primary-dark);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--border);}
  .count-pills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
  .count-pill{min-height:48px;border-radius:12px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;}
  .count-pill.selected{background:var(--primary);border-color:var(--primary);color:#fff;}
  .person-blocks{display:flex;flex-direction:column;gap:14px;margin-top:16px;}
  .person-card{padding:14px;border:1.5px solid var(--border);border-radius:14px;background:#fffaf5;}
  .person-card.primary{background:linear-gradient(180deg,#fff0de 0%,#fffaf5 100%);border-color:#d9a36c;}
  .p-title{font-weight:700;color:var(--primary-dark);margin-bottom:10px;}
  .p-note{display:block;margin-top:4px;font-size:12px;color:#5b7380;font-weight:500;}
  .person-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .gender-group,.radio-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .choice{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;}
  .choice.selected{border-color:var(--primary);background:#fff1e1;}
  .choice input{margin-top:2px;accent-color:var(--primary);}
  .choice small{display:block;color:#6c828d;}
  .field{margin-bottom:18px;position:relative;}
  .hint,.meta,.error-text{font-size:12.5px;color:#5b4638;margin-top:6px;}
  .error-text{color:var(--error);display:none;}
  .field.invalid .error-text{display:block;}
  .field.invalid input,.field.invalid .choice{border-color:var(--error);}
  .location-search-wrap{position:relative;}
  .suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.12);display:none;max-height:280px;overflow:auto;z-index:10;}
  .suggestions.show{display:block;}
  .suggestion{padding:11px 14px;border-bottom:1px solid #ebf2f6;cursor:pointer;}
  .suggestion:last-child{border-bottom:none;}
  .suggestion.active,.suggestion:hover{background:#fff1e1;}
  .suggestion strong{color:#2f241d;}
  .suggestion span{color:#5b4638;}
  .manual{display:none;padding:14px;border:1px dashed var(--border);border-radius:12px;background:#fff8f1;margin-top:12px;}
  .manual.show{display:block;}
  .manual-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .link-btn{border:none;background:none;padding:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;}
  .footer{width:min(100%,780px);margin:20px auto 0;background:#fff9f3;border:1px solid var(--border);border-radius:16px;padding:18px;}
  .footer h2{margin:0 0 12px;font-size:15px;color:var(--primary-dark);}
  .contact-grid{display:grid;grid-template-columns:1fr;gap:10px 18px;}
  .contact-item{color:#3f3026;}
  .contact-item a{color:var(--primary-dark);font-weight:700;text-decoration:none;}
  .suggestion span{display:none;}
  .status-box{display:none;text-align:center;padding:20px 0 0;}
  .status-box.show{display:block;}
  .status-box.error h2{color:var(--error);}
  .booking-id{display:inline-block;margin-top:10px;font-size:28px;font-weight:800;color:var(--primary-dark);letter-spacing:.6px;}
  .bookings-panel{display:none;margin-top:18px;border:1px solid var(--border);border-radius:16px;padding:16px;background:#fffaf5;}
  .bookings-panel.show{display:block;}
  .bookings-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff;}
  .bookings-table{width:100%;min-width:820px;border-collapse:collapse;}
  .bookings-table th,.bookings-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;}
  .bookings-table th{background:#fff1e1;color:#6a4d39;}
  .bookings-table tr{cursor:pointer;}
  .bookings-table tbody tr:hover td{background:#fff1df;}
  .edit-modal-card{width:min(100%,880px);max-height:min(88vh,900px);overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 18px 46px rgba(0,0,0,.24);}
  .edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .booking-participant{border:1px solid var(--border);border-radius:12px;padding:14px;background:#fffaf3;margin-bottom:12px;}
  .booking-participant h4{margin:0 0 10px;color:var(--primary-dark);}
  .participant-edit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  .readonly-lock{background:#f6ecde;color:#6a4d39;font-weight:700;cursor:not-allowed;pointer-events:none;user-select:none;}
  .readonly-value{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:#f6ecde;color:#6a4d39;font-weight:700;}
  .edit-accom-group{display:grid;grid-template-columns:1fr;gap:10px;}
  .validation-modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:16px;}
  .validation-modal.show{display:flex;}
  .validation-card{width:min(100%,520px);max-height:min(80vh,640px);overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 18px 46px rgba(0,0,0,.24);}
  .validation-list{padding-left:18px;}
  @media (min-width:640px){
    .contact-grid,.manual-grid{grid-template-columns:1fr 1fr;}
    .person-grid{grid-template-columns:2fr 1fr 1.3fr;}
  }
  @media (max-width:760px){.edit-grid,.participant-edit-grid{grid-template-columns:1fr;}}
  @media (max-width:520px){
    .count-pills{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="gate" id="gate">
    <div class="lang-switch">
      <button type="button" class="lang-btn active" data-language="en">English</button>
      <button type="button" class="lang-btn" data-language="mr">मराठी</button>
    </div>
    <h1 id="gateTitle"></h1>
    <p class="sub" id="gateSubtitle"></p>
    <div class="field" id="field-agent-mobile">
      <label id="agentMobileLabel" for="agentMobile"></label>
      <input type="tel" id="agentMobile" inputmode="numeric" maxlength="10" autocomplete="off">
      <div class="error-text" id="agentMobileError"></div>
    </div>
    <button type="button" class="btn" id="agentVerifyBtn"></button>
    <div class="meta" id="agentWelcome" style="margin-top:12px;"></div>
  </div>

  <div class="panel" id="panel">
    <div class="header">
      <h1 id="headerTitle"></h1>
      <p id="headerSubtitle"></p>
      <p id="agentGreeting" style="margin-top:10px;font-weight:600;"></p>
      <div class="header-actions">
        <button type="button" class="btn secondary" id="toggleBookingsBtn" style="width:auto;display:none;"></button>
        <button type="button" class="btn secondary" id="refreshBookingsBtn" style="width:auto;display:none;"></button>
      </div>
    </div>
    <div class="content">
      <form id="regForm" novalidate autocomplete="off">
        <input type="text" tabindex="-1" aria-hidden="true" autocomplete="username" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;">
        <input type="password" tabindex="-1" aria-hidden="true" autocomplete="new-password" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;">
        <div class="section">
          <div class="section-title" id="countSectionTitle"></div>
          <label id="countLabel"></label>
          <div class="count-pills" id="countPills"></div>
          <div class="person-blocks" id="participantBlocks"></div>
        </div>

        <div class="section">
          <div class="section-title" id="locationSectionTitle"></div>
          <div class="field" id="field-location">
            <label id="locationLabel" for="locationSearch"></label>
            <div class="location-search-wrap">
              <input type="text" id="locationSearch" autocomplete="off" autocapitalize="words" spellcheck="false">
              <div id="locationSuggestions" class="suggestions"></div>
            </div>
            <div class="hint" id="locationHint"></div>
            <div class="meta" id="locationMeta"></div>
            <button type="button" class="link-btn" id="manualLocationBtn"></button>
            <div class="error-text" id="locationError"></div>
            <div class="manual" id="manualLocationFields">
              <div class="manual-grid">
                <div class="field"><label id="manualAreaLabel" for="manualArea"></label><input type="text" id="manualArea" autocomplete="off"></div>
                <div class="field"><label id="manualCityLabel" for="manualCity"></label><input type="text" id="manualCity" autocomplete="off"></div>
                <div class="field"><label id="manualDistrictLabel" for="manualDistrict"></label><input type="text" id="manualDistrict" autocomplete="off"></div>
                <div class="field"><label id="manualStateLabel" for="manualState"></label><input type="text" id="manualState" autocomplete="off"></div>
                <div class="field"><label id="manualPostcodeLabel" for="manualPostcode"></label><input type="text" id="manualPostcode" maxlength="6" autocomplete="off"></div>
              </div>
            </div>
            <div class="hint" id="locationAttribution"></div>
          </div>
        </div>

        <div class="section">
          <div class="section-title" id="accomSectionTitle"></div>
          <div class="field" id="field-accom">
            <div class="radio-group" id="accomGroup" style="grid-template-columns:1fr;"></div>
            <div class="error-text" id="accomError"></div>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn"></button>
      </form>

      <div id="statusBox" class="status-box">
        <h2 id="statusTitle"></h2>
        <p id="statusMsg"></p>
        <div id="bookingIdDisplay" class="booking-id"></div>
      </div>

      <div id="bookingsPanel" class="bookings-panel">
        <h3 id="bookingsTitle"></h3>
        <div class="bookings-table-wrap">
          <table class="bookings-table">
            <thead>
              <tr>
                <th id="bookingsHeadBooking"></th>
                <th id="bookingsHeadName"></th>
                <th id="bookingsHeadMobile"></th>
                <th id="bookingsHeadAge"></th>
                <th id="bookingsHeadGender"></th>
                <th id="bookingsHeadCity"></th>
                <th id="bookingsHeadAccommodation"></th>
                <th id="bookingsHeadStatus"></th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody"></tbody>
          </table>
        </div>
        <div class="meta" id="bookingsEmpty" style="margin-top:10px;display:none;"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <h2 id="contactTitle"></h2>
    <div class="contact-grid" translate="no">
      <div class="contact-item" id="contact1"></div>
      <div class="contact-item" id="contact2"></div>
      <div class="contact-item" id="contact3"></div>
      <div class="contact-item" id="contact4"></div>
      <div class="contact-item" id="contact5"></div>
      <div class="contact-item" id="contact6"></div>
      <div class="contact-item" id="contact7"></div>
    </div>
  </div>
</div>

<div id="validationModal" class="validation-modal" role="dialog" aria-modal="true">
  <div class="validation-card">
    <h3 id="validationTitle"></h3>
    <p id="validationIntro"></p>
    <ul id="validationList" class="validation-list"></ul>
    <button type="button" class="btn secondary" id="closeValidationBtn" style="margin-top:16px;"></button>
  </div>
</div>

<div id="editBookingModal" class="validation-modal" role="dialog" aria-modal="true">
  <div class="edit-modal-card">
    <h3 id="editBookingTitle"></h3>
    <div class="edit-grid">
      <div><label for="editBookingNumber"></label><div id="editBookingNumber" class="readonly-value" aria-readonly="true"></div></div>
      <div>
        <label id="editAccommodationLabel"></label>
        <div id="editAccommodationGroup" class="edit-accom-group"></div>
      </div>
      <div><label for="editCity"></label><input id="editCity" type="text" autocomplete="off"></div>
    </div>
    <div id="editBookingParticipants"></div>
    <div class="row">
      <div class="error-text" id="editBookingError" style="display:none;"></div>
    </div>
    <div class="row">
      <button type="button" class="btn" id="saveBookingBtn" style="flex:1;"></button>
      <button type="button" class="btn secondary" id="cancelBookingBtn" style="flex:1;"></button>
    </div>
  </div>
</div>

function hardenAutofill(){
  document.querySelectorAll("input").forEach(function(input, index){
    input.setAttribute("autocomplete", "off");
    input.setAttribute("autocorrect", "off");
    input.setAttribute("autocapitalize", input.id === "locationSearch" ? "words" : "off");
    input.setAttribute("spellcheck", "false");
    input.setAttribute("data-form-type", "other");
    input.setAttribute("data-lpignore", "true");
    if (!input.name) input.name = "field_" + index + "_" + Math.random().toString(36).slice(2, 8);
    if (input.type !== "radio") {
      input.readOnly = true;
      const unlock = function(){
        input.readOnly = false;
        input.removeEventListener("focus", unlock);
        input.removeEventListener("pointerdown", unlock);
      };
      input.addEventListener("focus", unlock);
      input.addEventListener("pointerdown", unlock);
    }
  });
}

async function verifyAgent(){
  const field = document.getElementById("field-agent-mobile");
  const error = document.getElementById("agentMobileError");
  const mobile = document.getElementById("agentMobile").value.trim();
  field.classList.remove("invalid");
  error.style.display = "none";
  if (!MOBILE_REGEX.test(mobile)) {
    field.classList.add("invalid");
    error.textContent = t("agentMobileError");
    error.style.display = "block";
    return;
  }
  const response = await fetch(SCRIPT_URL + "?action=validateAgent&agentMobile=" + encodeURIComponent(mobile) + "&_=" + Date.now());
  const payload = await response.json();
  if (payload.status !== "success" || !payload.data || !payload.data.valid) {
    field.classList.add("invalid");
    error.textContent = t("agentMobileError");
    error.style.display = "block";
    return;

  validatedAgent = payload.data;

function renderAvailability(){
  if (!availabilityData) return;
  const selectedAccommodation = document.querySelector('input[name="accom"]:checked');
  if (selectedAccommodation && availabilityData[selectedAccommodation.value] && participantCount > availabilityData[selectedAccommodation.value].remaining) {
    document.getElementById("field-accom").classList.add("invalid");
    document.getElementById("accomError").textContent = formatMessage(t("errorCapacityExceeded"), {
      remaining: availabilityData[selectedAccommodation.value].remaining,
      accommodation: selectedAccommodation.value === "free" ? t("availabilityFreeTitle") : t("availabilityOwnTitle")
    });

  } else {
    document.getElementById("field-accom").classList.remove("invalid");
    document.getElementById("accomError").textContent = t("accomError");
    document.getElementById("accomError").style.display = "none";
  }
}

function handleLocationInput(event){
  const query = event.target.value.trim();
  selectedLocation = null;
  updateLocationMeta();
  if (locationDebounceId) clearTimeout(locationDebounceId);
  if (locationAbortController) locationAbortController.abort();
  if (query.length < 3) {
    hideSuggestions();
    return;
  }
  locationDebounceId = setTimeout(function(){ searchLocationSuggestions(query); }, 180);
}

function handleLocationKeydown(event){
  if (!currentSuggestions.length) return;
  if (event.key === "ArrowDown") {
    event.preventDefault();
    activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, currentSuggestions.length - 1);
    renderSuggestions();
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
    renderSuggestions();
  } else if (event.key === "Enter" && activeSuggestionIndex >= 0) {
    event.preventDefault();
    chooseSuggestion(currentSuggestions[activeSuggestionIndex]);
  } else if (event.key === "Escape") {
    hideSuggestions();
  }
}

async function searchLocationSuggestions(query){
  currentSuggestions = [];
  activeSuggestionIndex = -1;
  if (locationCache.has(query)) {
    currentSuggestions = locationCache.get(query);
    renderSuggestions();
    return;
  }
  document.getElementById("locationSuggestions").innerHTML = '<div class="suggestion"><strong>' + escapeHtml(t("locationLoading")) + "</strong></div>";
  document.getElementById("locationSuggestions").classList.add("show");
  locationAbortController = new AbortController();
  try {
    const params = new URLSearchParams({ q: query, limit: "10", bbox: PHOTON_BBOX.join(",") });
    const response = await fetch(PHOTON_URL + "?" + params.toString(), { signal: locationAbortController.signal });
    const payload = await response.json();
    const suggestions = normalizePhotonResults(payload && payload.features ? payload.features : []);
    locationCache.set(query, suggestions);
    currentSuggestions = suggestions;
    renderSuggestions();
    if (!suggestions.length) {
      document.getElementById("locationSuggestions").innerHTML = '<div class="suggestion"><strong>' + escapeHtml(t("locationNoResults")) + "</strong></div>";
      document.getElementById("locationSuggestions").classList.add("show");
    }
  } catch (error) {
    if (error.name === "AbortError") return;
    manualLocationVisible = true;
    renderManualLocation();
    document.getElementById("locationError").textContent = t("locationSearchError");
    document.getElementById("locationError").style.display = "block";
    hideSuggestions();
  }
}

function normalizePhotonResults(features){
  const seen = new Set();
  return features.map(function(feature){
    const props = feature.properties || {};
    const countryCode = String(props.countrycode || "").toLowerCase();
    const country = String(props.country || "").toLowerCase();
    if (countryCode !== "in" && country !== "india") return null;
    const city = firstNonEmpty([props.city, props.town, props.village]);
    const state = firstNonEmpty([props.state]);
    if (!city || !state) return null;
    if (/subdistrict/i.test(city)) return null;
    const district = firstNonEmpty([props.district, props.county, props.state_district, city]);
    const postcode = String(props.postcode || "").trim();
    const key = [city, state, postcode].join("|").toLowerCase();
    if (seen.has(key)) return null;
    seen.add(key);
    return { area: city, city: city, district: district, state: state, postcode: postcode, label: city + ", " + state };
  }).filter(Boolean);
}

function renderSuggestions(){
  const box = document.getElementById("locationSuggestions");
  if (!currentSuggestions.length) { hideSuggestions(); return; }
  box.innerHTML = currentSuggestions.map(function(item, index){
    return '<div class="suggestion' + (index === activeSuggestionIndex ? " active" : "") + '" data-index="' + index + '"><strong>' + escapeHtml(item.city) + '</strong><span></span></div>';
  }).join("");
  box.classList.add("show");
  box.querySelectorAll(".suggestion").forEach(function(item){
    item.addEventListener("mousedown", function(event){
      event.preventDefault();
      chooseSuggestion(currentSuggestions[Number(item.dataset.index)]);
    });
  });
}

  };

function validate(){
  const errors = [];
  let firstInvalid = null;
  function pushError(message, element){
    errors.push(message);
    if (!firstInvalid && element) firstInvalid = element;
  }

  document.querySelectorAll(".person-card").forEach(function(card, index){
    const personNo = index + 1;
    const name = card.querySelector(".p-name");
    const age = card.querySelector(".p-age");
    const mobile = card.querySelector(".p-mobile");
    const gender = card.querySelector('input[type="radio"]:checked');
    [name, age, mobile].forEach(function(field){ field.style.borderColor = ""; });
    card.querySelectorAll(".choice").forEach(function(choice){ choice.style.borderColor = ""; });

    if (!name.value.trim()) { name.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorNameRequired"), { index: personNo }), name); }
    if (!age.value.trim()) { age.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorAgeRequired"), { index: personNo }), age); }
    else if (!AGE_REGEX.test(age.value.trim())) { age.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorAgeInvalid"), { index: personNo }), age); }
    if (!mobile.value.trim()) { mobile.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorMobileRequired"), { index: personNo }), mobile); }
    else if (!MOBILE_REGEX.test(mobile.value.trim())) { mobile.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorMobileInvalid"), { index: personNo }), mobile); }
    if (!gender) {
      card.querySelectorAll(".choice").forEach(function(choice){ choice.style.borderColor = "#b33a30"; });
      pushError(formatMessage(t("errorGenderRequired"), { index: personNo }), card.querySelector(".gender-group"));
    }
  });

  const location = getResolvedLocation();
  const locationField = document.getElementById("field-location");
  locationField.classList.remove("invalid");
  document.getElementById("locationError").style.display = "none";
  if (!selectedLocation && !manualLocationVisible) {
    locationField.classList.add("invalid");
    document.getElementById("locationError").textContent = t("errorLocationRequired");
    document.getElementById("locationError").style.display = "block";
    pushError(t("errorLocationRequired"), document.getElementById("locationSearch"));
  }
  if (manualLocationVisible) {
    if (!location.area) pushError(t("errorManualAreaRequired"), document.getElementById("manualArea"));
    if (!location.city) pushError(t("errorManualCityRequired"), document.getElementById("manualCity"));
    if (!location.state) pushError(t("errorManualStateRequired"), document.getElementById("manualState"));
    if (location.postcode && !POSTCODE_REGEX.test(location.postcode)) pushError(t("errorManualPostcodeInvalid"), document.getElementById("manualPostcode"));
  }

  const accomField = document.getElementById("field-accom");
  accomField.classList.remove("invalid");
  const accom = document.querySelector('input[name="accom"]:checked');
  if (!accom) {
    accomField.classList.add("invalid");
    pushError(t("errorAccommodationRequired"), document.getElementById("accomGroup"));
  } else if (availabilityData && availabilityData[accom.value] && participantCount > availabilityData[accom.value].remaining) {
    accomField.classList.add("invalid");
    pushError(formatMessage(t("errorCapacityExceeded"), {
      remaining: availabilityData[accom.value].remaining,
      accommodation: accom.value === "free" ? t("availabilityFreeTitle") : t("availabilityOwnTitle")
    }), document.getElementById("accomGroup"));
  }

  return { isValid: errors.length === 0, errors: errors, firstInvalidField: firstInvalid };
}

function collectParticipants(){
  return Array.from(document.querySelectorAll(".person-card")).map(function(card){
    return {
      name: card.querySelector(".p-name").value.trim(),
      age: card.querySelector(".p-age").value.trim(),
      mobile: card.querySelector(".p-mobile").value.trim(),
      gender: card.querySelector('input[type="radio"]:checked').value
    };
  });
}

function toggleBookingsPanel(){
  bookingsVisible = !bookingsVisible;
  document.getElementById("bookingsPanel").classList.toggle("show", bookingsVisible);
  if (bookingsVisible) {
    renderVolunteerBookings();
    window.scrollTo({ top: document.getElementById("bookingsPanel").offsetTop - 24, behavior: "smooth" });
  }
}

async function loadVolunteerBookings(){
  if (!validatedAgent) return;
  const response = await fetch(SCRIPT_URL + "?action=getVolunteerBookings&agentMobile=" + encodeURIComponent(validatedAgent.mobile) + "&_=" + Date.now());
  const payload = await response.json();
  if (payload.status !== "success") throw new Error(payload.message || "Could not load bookings");
  volunteerBookings = Array.isArray(payload.data) ? payload.data : [];
  renderVolunteerBookings();
}

function renderVolunteerBookings(){
  const body = document.getElementById("bookingsTableBody");
  const empty = document.getElementById("bookingsEmpty");
  body.innerHTML = "";
  if (!volunteerBookings.length) {
    empty.style.display = "block";
    empty.textContent = currentLanguage === "mr" ? "अद्याप तुमची कोणतीही बुकिंग नाही." : "You do not have any bookings yet.";
    return;
  }
  empty.style.display = "none";
  volunteerBookings.slice().sort(function(a, b){
    return Number(b["Submission Number"] || 0) - Number(a["Submission Number"] || 0);
  }).forEach(function(row){
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + escapeHtml(row["Submission Number"]) + "</td>" +
      "<td>" + escapeHtml(row["Name"]) + "</td>" +
      "<td>" + escapeHtml(row["Mobile Number"]) + "</td>" +
      "<td>" + escapeHtml(row["Age"]) + "</td>" +
      "<td>" + escapeHtml(translateGenderValue(row["Type"])) + "</td>" +
      "<td>" + escapeHtml(row["City"]) + "</td>" +
      "<td>" + escapeHtml(translateAccommodationValue(row["Accommodation"])) + "</td>" +
      "<td>" + escapeHtml(translateStatusValue(row["Status"])) + "</td>";
    tr.addEventListener("click", function(){ openBookingEditor(row["Submission ID"]); });
    body.appendChild(tr);
  });
}

function getBookingRows(submissionId){
  return volunteerBookings.filter(function(row){
    return String(row["Submission ID"] || "") === String(submissionId || "");
  }).slice().sort(function(a, b){
    return Number(a["Person No."] || 0) - Number(b["Person No."] || 0);
  });
}

function getSelectedEditAccommodation(){
  const current = document.querySelector('#editAccommodationGroup input[name="editAccommodation"]:checked');
  return current ? current.value : "free";
}

function renderEditAccommodationOptions(selectedValue){
  const target = document.getElementById("editAccommodationGroup");
  const currentValue = selectedValue || "free";
  target.innerHTML =
    '<label class="choice' + (currentValue === "free" ? " selected" : "") + '">' +
      '<input type="radio" name="editAccommodation" value="free"' + (currentValue === "free" ? " checked" : "") + ">" +
      "<span><strong>" + escapeHtml(translateAccommodationValue("free")) + "</strong></span>" +
    "</label>" +
    '<label class="choice' + (currentValue === "own" ? " selected" : "") + '">' +
      '<input type="radio" name="editAccommodation" value="own"' + (currentValue === "own" ? " checked" : "") + ">" +
      "<span><strong>" + escapeHtml(translateAccommodationValue("own")) + "</strong></span>" +
    "</label>";
  target.querySelectorAll(".choice").forEach(function(choice){
    choice.addEventListener("click", function(){
      target.querySelectorAll(".choice").forEach(function(item){ item.classList.remove("selected"); });
      choice.classList.add("selected");
      const radio = choice.querySelector('input[type="radio"]');
      if (radio) radio.checked = true;
    });
  });
}

function openBookingEditor(submissionId){
  const rows = getBookingRows(submissionId);
  if (!rows.length) return;
  editingSubmissionId = submissionId;
  document.getElementById("editBookingNumber").textContent = rows[0]["Submission Number"] || "";
  renderEditAccommodationOptions(rows[0]["Accommodation"] || "free");
  document.getElementById("editCity").value = rows[0]["City"] || "";
  document.getElementById("editBookingError").style.display = "none";
  const container = document.getElementById("editBookingParticipants");
  container.innerHTML = "";
  rows.forEach(function(row, index){
    const card = document.createElement("div");
    card.className = "booking-participant";
    card.innerHTML =
      "<h4>" + escapeHtml((currentLanguage === "mr" ? "सहभागी " : "Participant ") + (index + 1)) + "</h4>" +
      '<div class="participant-edit-grid">' +
      '<input type="text" class="edit-name" value="' + escapeHtml(row["Name"] || "") + '" autocomplete="off">' +
      '<input type="number" class="edit-age" value="' + escapeHtml(row["Age"] || "") + '" min="1" max="120" autocomplete="off">' +
      '<input type="tel" class="edit-mobile" value="' + escapeHtml(row["Mobile Number"] || "") + '" autocomplete="off">' +
      '<select class="edit-gender"><option value="male"' + (row["Type"] === "Gent" ? " selected" : "") + '>' + escapeHtml(currentLanguage === "mr" ? "पुरुष" : "Male") + '</option><option value="female"' + (row["Type"] === "Lady" ? " selected" : "") + '>' + escapeHtml(currentLanguage === "mr" ? "स्त्री" : "Female") + "</option></select>" +
      "</div>";
    container.appendChild(card);
  });
  document.getElementById("editBookingModal").classList.add("show");
}

function closeBookingEditor(){
  editingSubmissionId = "";
  document.getElementById("editBookingModal").classList.remove("show");
}

async function saveBookingEdit(){
  if (!validatedAgent || !editingSubmissionId) return;
  const participants = Array.from(document.querySelectorAll("#editBookingParticipants .booking-participant")).map(function(card){
    return {
      name: card.querySelector(".edit-name").value.trim(),
      age: card.querySelector(".edit-age").value.trim(),
      mobile: card.querySelector(".edit-mobile").value.trim(),
      gender: card.querySelector(".edit-gender").value
    };
  });
  try {
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "updateBooking",
        agentMobile: validatedAgent.mobile,
        submissionId: editingSubmissionId,
        accommodation: getSelectedEditAccommodation(),
        location: {
          city: document.getElementById("editCity").value.trim(),
          district: document.getElementById("editCity").value.trim()
        },
        participants: participants
      })
    });
    const result = await response.json();
    if (result.status !== "success") throw new Error(result.message || "Could not save booking");
    closeBookingEditor();
    await loadAvailability();
    await loadVolunteerBookings();
    bookingsVisible = true;
    document.getElementById("bookingsPanel").classList.add("show");
  } catch (error) {
    const target = document.getElementById("editBookingError");
    target.textContent = error && error.message ? error.message : "Could not save booking";
    target.style.display = "block";
  }
}

function translateAccommodationValue(value){
  if (currentLanguage === "mr") return String(value || "").toLowerCase() === "free" ? "मोफत" : "स्वतःचे / सशुल्क";
  return String(value || "").toLowerCase() === "free" ? "Free" : "Own/Paid";
}

function translateStatusValue(value){
  const normalized = String(value || "").toLowerCase() === "inactive" ? "inactive" : "active";
  if (currentLanguage === "mr") return normalized === "active" ? "सक्रिय" : "निष्क्रिय";
  return normalized === "active" ? "Active" : "Inactive";
}

function translateGenderValue(value){
  if (currentLanguage === "mr") return value === "Lady" ? "स्त्री" : "पुरुष";
  return value === "Lady" ? "Female" : "Male";
}

async function handleSubmit(event){
  event.preventDefault();
  if (!validatedAgent) return;
  const validation = validate();
  if (!validation.isValid) {
    showValidationModal(validation.errors, validation.firstInvalidField);
    return;
  }
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = t("submitting");
  const participants = collectParticipants();
  const submissionId = "sub_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  const payload = {
    participants: participants,
    accommodation: document.querySelector('input[name="accom"]:checked').value,
    timestamp: new Date().toISOString(),
    submissionId: submissionId,
    formLanguage: currentLanguage,
    location: getResolvedLocation(),
    isAgentRegistration: true,
    agentMobile: validatedAgent.mobile
  };

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(function(){ controller.abort(); }, REQUEST_TIMEOUT_MS);
    let response;
    try {
      response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeoutId);
    }
    const result = await response.json();
    if (result.status !== "success") throw new Error(result.message || "Submission failed");
    await loadAvailability();
    await loadVolunteerBookings();
    showSuccess(participants.length, false, String(result.submissionNumber || ""));
  } catch (error) {
    const verification = await verifySubmission(submissionId);
    if (verification.confirmed) {
      await loadAvailability();
      await loadVolunteerBookings();
      showSuccess(participants.length, true, verification.bookingId);
      return;
    }
    submitBtn.disabled = false;
    submitBtn.textContent = t("submit");
    showFailure(error && error.message ? error.message : t("failureMessage"));
  }
}

async function verifySubmission(submissionId){
  for (let attempt = 0; attempt < VERIFY_ATTEMPTS; attempt++) {
    try {
      const response = await fetch(SCRIPT_URL + "?action=getSubmissionStatus&submissionId=" + encodeURIComponent(submissionId) + "&_=" + Date.now());
      const result = await response.json();
      if (result && result.status === "success" && result.data && result.data.exists) {
        return { confirmed: true, bookingId: String(result.data.submissionNumber || "") };
      }
    } catch (error) {}
    if (attempt < VERIFY_ATTEMPTS - 1) await wait(VERIFY_WAIT_MS);
  }
  return { confirmed: false, bookingId: "" };
}

function showSuccess(count, verifiedAfterRetry, bookingId){
  document.getElementById("regForm").style.display = "none";
  const statusBox = document.getElementById("statusBox");
  statusBox.classList.add("show");
  statusBox.classList.remove("error");
  document.getElementById("statusTitle").textContent = t("successTitle");
  document.getElementById("statusMsg").textContent = formatMessage(verifiedAfterRetry ? t("successMessageRetry") : t("successMessage"), {
    count: count,
    bookingId: "",
    agent: validatedAgent.name
  });
  document.getElementById("bookingIdDisplay").textContent = bookingId;
}

function showFailure(message){
  const statusBox = document.getElementById("statusBox");
  statusBox.classList.add("show", "error");
  document.getElementById("statusTitle").textContent = t("failureTitle");
  document.getElementById("statusMsg").textContent = message;
}

function showValidationModal(errors, firstInvalidField){
  validationFocusTarget = firstInvalidField || null;
  const list = document.getElementById("validationList");
  list.innerHTML = "";
  errors.forEach(function(message){
    const item = document.createElement("li");
    item.textContent = message;
    list.appendChild(item);
  });
  document.getElementById("validationModal").classList.add("show");
}

function closeValidationModal(){
  document.getElementById("validationModal").classList.remove("show");
  if (validationFocusTarget && typeof validationFocusTarget.scrollIntoView === "function") {
    validationFocusTarget.scrollIntoView({ behavior: "smooth", block: "center" });
    if (typeof validationFocusTarget.focus === "function") validationFocusTarget.focus({ preventScroll: true });
  }
}

function firstNonEmpty(values){
  for (let i = 0; i < values.length; i++) {
    const value = String(values[i] || "").trim();
    if (value) return value;
  }
  return "";
}

function formatMessage(template, values){
  return String(template).replace(/\{(\w+)\}/g, function(_, key){ return values[key] !== undefined ? values[key] : ""; });
}

function wait(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

function escapeHtml(value){
  return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
