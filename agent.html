<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Registration - Shripad Shrivallabh Charitamrut Samohik Parayan- 2</title>

<style>
  :root{
    --primary:#1f5f74;
    --primary-dark:#15495a;
    --accent:#e18d2f;
    --bg:#eef7fa;
    --card:#ffffff;
    --ink:#20323a;
    --border:#cfe2ea;
    --error:#b33a30;
    --success:#2f7d4f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins','Noto Sans Devanagari',sans-serif;background:linear-gradient(180deg,#eef7fa 0%,#dcedf4 100%);color:var(--ink);}
  .shell{min-height:100vh;padding:20px;}
  .gate,.panel{width:min(100%,780px);margin:0 auto;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:24px;box-shadow:0 20px 48px rgba(21,73,90,.14);}
  .gate{max-width:460px;margin-top:60px;padding:28px;}
  .lang-switch{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;}
  .lang-btn{padding:8px 12px;border-radius:999px;background:#e8f2f6;color:var(--primary-dark);font-weight:700;}
  .lang-btn.active{background:var(--primary);color:#fff;}
  .gate h1,.header h1{font-family:'Noto Serif','Noto Sans Devanagari',serif;margin:0 0 10px;color:var(--primary-dark);}
  .sub{color:#5b7380;font-size:14px;margin-bottom:18px;}
  input[type="text"],input[type="tel"],input[type="number"]{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font:inherit;background:#fbfeff;color:var(--ink);}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,95,116,.12);}
  button{font:inherit;border:none;cursor:pointer;}
  .btn{width:100%;padding:14px 16px;border-radius:12px;background:linear-gradient(120deg,var(--primary),var(--primary-dark));color:#fff;font-weight:700;}
  .btn.secondary{background:#e8f2f6;color:var(--primary-dark);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .panel{display:none;margin-top:20px;overflow:hidden;}
  .header{background:linear-gradient(120deg,var(--primary-dark),var(--primary));padding:24px 24px 28px;color:#eef8fb;text-align:center;}
  .header p{margin:0;color:#d7ecf4;}
  .content{padding:24px;}
  .section{margin-bottom:28px;}
  .section-title{font-size:16px;font-weight:700;color:var(--primary-dark);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--border);}
  .availability{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px;}
  .availability-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:#f8fcfd;}
  .availability-card.full{background:#fff4f4;border-color:#e3c3c1;}
  .count-pills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
  .count-pill{min-height:48px;border-radius:12px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;}
  .count-pill.selected{background:var(--primary);border-color:var(--primary);color:#fff;}
  .person-blocks{display:flex;flex-direction:column;gap:14px;margin-top:16px;}
  .person-card{padding:14px;border:1.5px solid var(--border);border-radius:14px;background:#f8fcfd;}
  .person-card.primary{background:linear-gradient(180deg,#ecf7fa 0%,#f8fcfd 100%);border-color:#8ab5c6;}
  .p-title{font-weight:700;color:var(--primary-dark);margin-bottom:10px;}
  .p-note{display:block;margin-top:4px;font-size:12px;color:#5b7380;font-weight:500;}
  .person-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .gender-group,.radio-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .choice{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;}
  .choice.selected{border-color:var(--primary);background:#edf7fa;}
  .choice input{margin-top:2px;accent-color:var(--primary);}
  .choice small{display:block;color:#6c828d;}
  .field{margin-bottom:18px;position:relative;}
  .hint,.meta,.error-text{font-size:12.5px;color:#6c828d;margin-top:6px;}
  .error-text{color:var(--error);display:none;}
  .field.invalid .error-text{display:block;}
  .field.invalid input,.field.invalid .choice{border-color:var(--error);}
  .suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.12);display:none;max-height:280px;overflow:auto;z-index:10;}
  .suggestions.show{display:block;}
  .suggestion{padding:11px 14px;border-bottom:1px solid #ebf2f6;cursor:pointer;}
  .suggestion:last-child{border-bottom:none;}
  .suggestion.active,.suggestion:hover{background:#edf7fa;}
  .manual{display:none;padding:14px;border:1px dashed var(--border);border-radius:12px;background:#f9fdfe;margin-top:12px;}
  .manual.show{display:block;}
  .manual-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .link-btn{border:none;background:none;padding:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;}
  .footer{width:min(100%,780px);margin:20px auto 0;background:#f7fbfc;border:1px solid var(--border);border-radius:16px;padding:18px;}
  .footer h2{margin:0 0 12px;font-size:15px;color:var(--primary-dark);}
  .contact-grid{display:grid;grid-template-columns:1fr;gap:10px 18px;}
  .contact-item a{color:var(--primary-dark);font-weight:700;text-decoration:none;}
  .status-box{display:none;text-align:center;padding:20px 0 0;}
  .status-box.show{display:block;}
  .status-box.error h2{color:var(--error);}
  .validation-modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:16px;}
  .validation-modal.show{display:flex;}
  .validation-card{width:min(100%,520px);max-height:min(80vh,640px);overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 18px 46px rgba(0,0,0,.24);}
  .validation-list{padding-left:18px;}
  @media (min-width:640px){
    .availability,.contact-grid,.manual-grid{grid-template-columns:1fr 1fr;}
    .person-grid{grid-template-columns:2fr 1fr 1.3fr;}
  }
  @media (max-width:520px){
    .count-pills{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
</style>
</head>

        <div class="section">

          <label id="countLabel"></label>
          <div class="count-pills" id="countPills"></div>
          <div class="person-blocks" id="participantBlocks"></div>
        </div>

        <div class="section">
          <div class="section-title" id="locationSectionTitle"></div>
          <div class="field" id="field-location">
            <label id="locationLabel" for="locationSearch"></label>
            <input type="text" id="locationSearch" autocomplete="off">
            <div id="locationSuggestions" class="suggestions"></div>
            <div class="hint" id="locationHint"></div>
            <div class="meta" id="locationMeta"></div>
            <button type="button" class="link-btn" id="manualLocationBtn"></button>

            <div class="manual" id="manualLocationFields">

                <div class="field"><label id="manualDistrictLabel" for="manualDistrict"></label><input type="text" id="manualDistrict"></div>
                <div class="field"><label id="manualStateLabel" for="manualState"></label><input type="text" id="manualState"></div>
                <div class="field"><label id="manualPostcodeLabel" for="manualPostcode"></label><input type="text" id="manualPostcode" maxlength="6"></div>
              </div>
            </div>
            <div class="hint" id="locationAttribution"></div>
          </div>
        </div>

        <div class="section">
          <div class="section-title" id="accomSectionTitle"></div>
          <div class="field" id="field-accom">
            <div class="radio-group" id="accomGroup" style="grid-template-columns:1fr;"></div>
            <div class="error-text" id="accomError"></div>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn"></button>
      </form>

      <div id="statusBox" class="status-box">
        <h2 id="statusTitle"></h2>
        <p id="statusMsg"></p>
      </div>
    </div>

</div>

});

});

    renderParticipantBlocks();
  });
});

applyLanguage();
renderCountPills();
renderParticipantBlocks();

function t(key){ return TEXTS[currentLanguage][key]; }

function applyLanguage(){
  document.documentElement.lang = currentLanguage;
  document.getElementById("gateTitle").textContent = t("gateTitle");
  document.getElementById("gateSubtitle").textContent = t("gateSubtitle");
  document.getElementById("agentMobileLabel").textContent = t("agentMobileLabel");
  document.getElementById("agentVerifyBtn").textContent = t("verifyButton");
  document.getElementById("headerTitle").textContent = t("headerTitle");
  document.getElementById("headerSubtitle").textContent = t("headerSubtitle");
  document.getElementById("availabilityTitle").textContent = t("availabilityTitle");
  document.getElementById("availabilityFreeTitle").textContent = t("availabilityFreeTitle");
  document.getElementById("availabilityOwnTitle").textContent = t("availabilityOwnTitle");
  document.getElementById("countSectionTitle").textContent = t("countSectionTitle");
  document.getElementById("countLabel").textContent = t("countLabel");
  document.getElementById("locationSectionTitle").textContent = t("locationSectionTitle");
  document.getElementById("locationLabel").textContent = t("locationLabel");
  document.getElementById("locationSearch").placeholder = t("locationPlaceholder");
  document.getElementById("locationHint").textContent = t("locationHint");
  document.getElementById("manualLocationBtn").textContent = t("manualLocation");
  document.getElementById("locationAttribution").textContent = t("locationAttribution");
  document.getElementById("manualAreaLabel").textContent = t("manualAreaLabel");
  document.getElementById("manualCityLabel").textContent = t("manualCityLabel");
  document.getElementById("manualDistrictLabel").textContent = t("manualDistrictLabel");
  document.getElementById("manualStateLabel").textContent = t("manualStateLabel");
  document.getElementById("manualPostcodeLabel").textContent = t("manualPostcodeLabel");
  document.getElementById("accomSectionTitle").textContent = t("accomSectionTitle");
  document.getElementById("accomError").textContent = t("accomError");
  document.getElementById("submitBtn").textContent = t("submit");
  document.getElementById("contactTitle").textContent = t("contactTitle");
  document.getElementById("validationTitle").textContent = t("validationTitle");
  document.getElementById("validationIntro").textContent = t("validationIntro");
  document.getElementById("closeValidationBtn").textContent = t("validationClose");
  renderAccommodationOptions();
  renderAvailability();
}

async function verifyAgent(){
  const field = document.getElementById("field-agent-mobile");
  const error = document.getElementById("agentMobileError");
  const mobile = document.getElementById("agentMobile").value.trim();
  field.classList.remove("invalid");
  error.style.display = "none";
  if (!MOBILE_REGEX.test(mobile)) {
    field.classList.add("invalid");
    error.textContent = t("agentMobileError");
    error.style.display = "block";
    return;
  }
  const response = await fetch(SCRIPT_URL + "?action=validateAgent&agentMobile=" + encodeURIComponent(mobile) + "&_=" + Date.now());
  const payload = await response.json();
  if (payload.status !== "success" || !payload.data || !payload.data.valid) {
    field.classList.add("invalid");
    error.textContent = t("agentMobileError");
    error.style.display = "block";
    return;
  }
  validatedAgent = payload.data;
  document.getElementById("agentWelcome").textContent = formatMessage(t("greeting"), { name: validatedAgent.name });
  document.getElementById("agentGreeting").textContent = formatMessage(t("greeting"), { name: validatedAgent.name });
  document.getElementById("gate").style.display = "none";
  document.getElementById("panel").style.display = "block";
  await loadAvailability();
}

function renderCountPills(){
  const container = document.getElementById("countPills");
  container.innerHTML = "";
  for (let i = 1; i <= MAX_PARTICIPANTS; i++) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "count-pill" + (participantCount === i ? " selected" : "");
    btn.textContent = String(i);
    btn.addEventListener("click", function(){
      participantCount = i;
      renderCountPills();
      renderParticipantBlocks();
      renderAvailability();
    });
    container.appendChild(btn);
  }
}

function renderParticipantBlocks(){
  const container = document.getElementById("participantBlocks");
  const existing = Array.from(container.querySelectorAll(".person-card")).map(function(card){
    return {
      name: card.querySelector(".p-name").value,
      age: card.querySelector(".p-age").value,
      mobile: card.querySelector(".p-mobile").value,
      gender: (card.querySelector('input[type="radio"]:checked') || {}).value || ""
    };
  });
  container.innerHTML = "";
  for (let i = 0; i < participantCount; i++) {
    const value = existing[i] || { name: "", age: "", mobile: "", gender: "" };
    const card = document.createElement("div");
    card.className = "person-card" + (i === 0 ? " primary" : "");
    card.innerHTML =
      '<div class="p-title">' + escapeHtml(t("personTitle")) + " " + (i + 1) + (i === 0 ? '<span class="p-note">' + escapeHtml(t("primaryNote")) + "</span>" : "") + "</div>" +
      '<div class="person-grid">' +
      '<input type="text" class="p-name" placeholder="' + escapeHtml(t("namePlaceholder")) + '" value="' + escapeHtml(value.name) + '">' +
      '<input type="number" class="p-age" placeholder="' + escapeHtml(t("agePlaceholder")) + '" value="' + escapeHtml(value.age) + '" min="1" max="120">' +
      '<input type="tel" class="p-mobile" placeholder="' + escapeHtml(t("mobilePlaceholder")) + '" value="' + escapeHtml(value.mobile) + '">' +
      "</div>" +
      '<div class="gender-group">' +
      renderGenderOption(i, "male", t("male"), value.gender === "male") +
      renderGenderOption(i, "female", t("female"), value.gender === "female") +
      "</div>";
    container.appendChild(card);
    card.querySelectorAll(".choice").forEach(function(choice){
      choice.addEventListener("click", function(){
        choice.parentElement.querySelectorAll(".choice").forEach(function(item){ item.classList.remove("selected"); item.style.borderColor = ""; });
        choice.classList.add("selected");
      });
    });
  }
}

function renderGenderOption(index, value, label, selected){
  return '<label class="choice' + (selected ? " selected" : "") + '">' +
    '<input type="radio" name="gender_' + index + '" value="' + value + '"' + (selected ? " checked" : "") + ">" +
    "<span><strong>" + escapeHtml(label) + "</strong></span>" +
    "</label>";
}

function renderAccommodationOptions(){
  const current = document.querySelector('input[name="accom"]:checked');
  const currentValue = current ? current.value : "";
  document.getElementById("accomGroup").innerHTML =
    renderAccommodationOption("free", t("accomFreeTitle"), t("accomFreeHint"), currentValue === "free") +
    renderAccommodationOption("own", t("accomOwnTitle"), t("accomOwnHint"), currentValue === "own");
  document.querySelectorAll('#accomGroup .choice').forEach(function(choice){
    choice.addEventListener("click", function(){
      if (choice.dataset.disabled === "true") return;
      document.querySelectorAll('#accomGroup .choice').forEach(function(item){ item.classList.remove("selected"); });
      choice.classList.add("selected");
      choice.querySelector("input").checked = true;
      renderAvailability();
    });
  });
}

function renderAccommodationOption(value, title, hint, selected){
  const availability = availabilityData && availabilityData[value];
  const isFull = availability && availability.remaining <= 0;
  return '<label class="choice' + (selected ? " selected" : "") + '" data-disabled="' + (isFull ? "true" : "false") + '">' +
    '<input type="radio" name="accom" value="' + value + '"' + (selected ? " checked" : "") + (isFull ? " disabled" : "") + ">" +
    "<span><strong>" + escapeHtml(title) + "</strong><small>" + escapeHtml(isFull ? t("availabilityFull") : hint) + "</small></span>" +
    "</label>";
}

async function loadAvailability(){
  try {
    const response = await fetch(SCRIPT_URL + "?action=getAvailability&_=" + Date.now());
    const payload = await response.json();
    if (payload.status !== "success") throw new Error(payload.message || "Availability failed");
    availabilityData = payload.data || null;
    renderAccommodationOptions();
    renderAvailability();
  } catch (error) {
    availabilityData = null;
    renderAvailability();
    document.getElementById("availabilityStatus").textContent = t("availabilityError");
  }
}

function renderAvailability(){
  if (!availabilityData) {
    document.getElementById("availabilityFreeText").textContent = "-";
    document.getElementById("availabilityOwnText").textContent = "-";
    return;
  }
  ["free", "own"].forEach(function(key){
    const item = availabilityData[key];
    document.getElementById(key === "free" ? "availabilityFreeText" : "availabilityOwnText").textContent =
      item.remaining <= 0 ? t("availabilityFull") : formatMessage(t("availabilityPattern"), item);
    document.getElementById(key === "free" ? "availabilityFree" : "availabilityOwn").classList.toggle("full", item.remaining <= 0);
  });
  const selectedAccommodation = document.querySelector('input[name="accom"]:checked');
  if (selectedAccommodation && availabilityData[selectedAccommodation.value] && participantCount > availabilityData[selectedAccommodation.value].remaining) {
    document.getElementById("availabilityStatus").textContent = formatMessage(t("errorCapacityExceeded"), {
      remaining: availabilityData[selectedAccommodation.value].remaining,
      accommodation: selectedAccommodation.value === "free" ? t("availabilityFreeTitle") : t("availabilityOwnTitle")
    });
  } else {
    document.getElementById("availabilityStatus").textContent = "";
  }
}

function handleLocationInput(event){
  const query = event.target.value.trim();
  selectedLocation = null;
  updateLocationMeta();
  if (locationDebounceId) clearTimeout(locationDebounceId);
  if (locationAbortController) locationAbortController.abort();
  if (query.length < 3) {
    hideSuggestions();
    return;
  }
  locationDebounceId = setTimeout(function(){ searchLocationSuggestions(query); }, 450);
}

function handleLocationKeydown(event){
  if (!currentSuggestions.length) return;
  if (event.key === "ArrowDown") {
    event.preventDefault();
    activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, currentSuggestions.length - 1);
    renderSuggestions();
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
    renderSuggestions();
  } else if (event.key === "Enter" && activeSuggestionIndex >= 0) {
    event.preventDefault();
    chooseSuggestion(currentSuggestions[activeSuggestionIndex]);
  } else if (event.key === "Escape") {
    hideSuggestions();
  }
}

async function searchLocationSuggestions(query){
  currentSuggestions = [];
  activeSuggestionIndex = -1;
  if (locationCache.has(query)) {
    currentSuggestions = locationCache.get(query);
    renderSuggestions();
    return;
  }
  document.getElementById("locationSuggestions").innerHTML = '<div class="suggestion"><strong>' + escapeHtml(t("locationLoading")) + "</strong></div>";
  document.getElementById("locationSuggestions").classList.add("show");
  locationAbortController = new AbortController();
  try {
    const params = new URLSearchParams({ q: query, limit: "10", bbox: PHOTON_BBOX.join(",") });
    const response = await fetch(PHOTON_URL + "?" + params.toString(), { signal: locationAbortController.signal });
    const payload = await response.json();
    const suggestions = normalizePhotonResults(payload && payload.features ? payload.features : []);
    locationCache.set(query, suggestions);
    currentSuggestions = suggestions;
    renderSuggestions();
    if (!suggestions.length) {
      document.getElementById("locationSuggestions").innerHTML = '<div class="suggestion"><strong>' + escapeHtml(t("locationNoResults")) + "</strong></div>";
      document.getElementById("locationSuggestions").classList.add("show");
    }
  } catch (error) {
    if (error.name === "AbortError") return;
    manualLocationVisible = true;
    renderManualLocation();
    document.getElementById("locationError").textContent = t("locationSearchError");
    document.getElementById("locationError").style.display = "block";
    hideSuggestions();
  }
}

function normalizePhotonResults(features){
  const seen = new Set();
  return features.map(function(feature){
    const props = feature.properties || {};
    const countryCode = String(props.countrycode || "").toLowerCase();
    const country = String(props.country || "").toLowerCase();
    if (countryCode !== "in" && country !== "india") return null;
    const area = firstNonEmpty([props.name, props.suburb, props.locality, props.district]);
    const city = firstNonEmpty([props.city, props.town, props.county, props.state_district, props.district, props.village]);
    const district = firstNonEmpty([props.district, props.county, props.state_district, city]);
    const state = firstNonEmpty([props.state]);
    if (!area || !city || !state) return null;
    const postcode = String(props.postcode || "").trim();
    const key = [area, city, district, state, postcode].join("|").toLowerCase();
    if (seen.has(key)) return null;
    seen.add(key);
    return { area: area, city: city, district: district, state: state, postcode: postcode, label: area + ", " + city + ", " + state };
  }).filter(Boolean);
}

function renderSuggestions(){
  const box = document.getElementById("locationSuggestions");
  if (!currentSuggestions.length) { hideSuggestions(); return; }
  box.innerHTML = currentSuggestions.map(function(item, index){
    return '<div class="suggestion' + (index === activeSuggestionIndex ? " active" : "") + '" data-index="' + index + '"><strong>' + escapeHtml(item.area) + '</strong><span>' + escapeHtml(item.city + ", " + item.state + (item.postcode ? " " + item.postcode : "")) + "</span></div>";
  }).join("");
  box.classList.add("show");
  box.querySelectorAll(".suggestion").forEach(function(item){
    item.addEventListener("mousedown", function(event){
      event.preventDefault();
      chooseSuggestion(currentSuggestions[Number(item.dataset.index)]);
    });
  });
}

function chooseSuggestion(item){
  selectedLocation = item;
  manualLocationVisible = false;
  document.getElementById("locationSearch").value = item.label;
  hideSuggestions();
  renderManualLocation();
  updateLocationMeta();
}

function hideSuggestions(){ document.getElementById("locationSuggestions").classList.remove("show"); }

function renderManualLocation(){ document.getElementById("manualLocationFields").classList.toggle("show", manualLocationVisible); }

function updateLocationMeta(){
  document.getElementById("locationMeta").textContent = selectedLocation ? formatMessage(t("locationSelected"), selectedLocation) : "";
}

function getResolvedLocation(){
  if (selectedLocation && !manualLocationVisible) return selectedLocation;
  return {
    area: document.getElementById("manualArea").value.trim(),
    city: document.getElementById("manualCity").value.trim(),
    district: document.getElementById("manualDistrict").value.trim() || document.getElementById("manualCity").value.trim(),
    state: document.getElementById("manualState").value.trim(),
    postcode: document.getElementById("manualPostcode").value.trim()
  };
}

function validate(){
  const errors = [];
  let firstInvalid = null;
  function pushError(message, element){
    errors.push(message);
    if (!firstInvalid && element) firstInvalid = element;
  }

  document.querySelectorAll(".person-card").forEach(function(card, index){
    const personNo = index + 1;
    const name = card.querySelector(".p-name");
    const age = card.querySelector(".p-age");
    const mobile = card.querySelector(".p-mobile");
    const gender = card.querySelector('input[type="radio"]:checked');
    [name, age, mobile].forEach(function(field){ field.style.borderColor = ""; });
    card.querySelectorAll(".choice").forEach(function(choice){ choice.style.borderColor = ""; });

    if (!name.value.trim()) { name.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorNameRequired"), { index: personNo }), name); }
    if (!age.value.trim()) { age.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorAgeRequired"), { index: personNo }), age); }
    else if (!AGE_REGEX.test(age.value.trim())) { age.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorAgeInvalid"), { index: personNo }), age); }
    if (!mobile.value.trim()) { mobile.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorMobileRequired"), { index: personNo }), mobile); }
    else if (!MOBILE_REGEX.test(mobile.value.trim())) { mobile.style.borderColor = "#b33a30"; pushError(formatMessage(t("errorMobileInvalid"), { index: personNo }), mobile); }
    if (!gender) {
      card.querySelectorAll(".choice").forEach(function(choice){ choice.style.borderColor = "#b33a30"; });
      pushError(formatMessage(t("errorGenderRequired"), { index: personNo }), card.querySelector(".gender-group"));
    }
  });

  const location = getResolvedLocation();
  const locationField = document.getElementById("field-location");
  locationField.classList.remove("invalid");
  document.getElementById("locationError").style.display = "none";
  if (!selectedLocation && !manualLocationVisible) {
    locationField.classList.add("invalid");
    document.getElementById("locationError").textContent = t("errorLocationRequired");
    document.getElementById("locationError").style.display = "block";
    pushError(t("errorLocationRequired"), document.getElementById("locationSearch"));
  }
  if (manualLocationVisible) {
    if (!location.area) pushError(t("errorManualAreaRequired"), document.getElementById("manualArea"));
    if (!location.city) pushError(t("errorManualCityRequired"), document.getElementById("manualCity"));
    if (!location.state) pushError(t("errorManualStateRequired"), document.getElementById("manualState"));
    if (location.postcode && !POSTCODE_REGEX.test(location.postcode)) pushError(t("errorManualPostcodeInvalid"), document.getElementById("manualPostcode"));
  }

  const accomField = document.getElementById("field-accom");
  accomField.classList.remove("invalid");
  const accom = document.querySelector('input[name="accom"]:checked');
  if (!accom) {
    accomField.classList.add("invalid");
    pushError(t("errorAccommodationRequired"), document.getElementById("accomGroup"));
  } else if (availabilityData && availabilityData[accom.value] && participantCount > availabilityData[accom.value].remaining) {
    accomField.classList.add("invalid");
    pushError(formatMessage(t("errorCapacityExceeded"), {
      remaining: availabilityData[accom.value].remaining,
      accommodation: accom.value === "free" ? t("availabilityFreeTitle") : t("availabilityOwnTitle")
    }), document.getElementById("accomGroup"));
  }

  return { isValid: errors.length === 0, errors: errors, firstInvalidField: firstInvalid };
}

function collectParticipants(){
  return Array.from(document.querySelectorAll(".person-card")).map(function(card){
    return {
      name: card.querySelector(".p-name").value.trim(),
      age: card.querySelector(".p-age").value.trim(),
      mobile: card.querySelector(".p-mobile").value.trim(),
      gender: card.querySelector('input[type="radio"]:checked').value
    };
  });
}

async function handleSubmit(event){
  event.preventDefault();
  if (!validatedAgent) return;
  const validation = validate();
  if (!validation.isValid) {
    showValidationModal(validation.errors, validation.firstInvalidField);
    return;
  }
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = t("submitting");
  const participants = collectParticipants();
  const submissionId = "sub_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  const payload = {
    participants: participants,
    accommodation: document.querySelector('input[name="accom"]:checked').value,
    timestamp: new Date().toISOString(),
    submissionId: submissionId,
    formLanguage: currentLanguage,
    location: getResolvedLocation(),
    isAgentRegistration: true,
    agentMobile: validatedAgent.mobile
  };

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(function(){ controller.abort(); }, REQUEST_TIMEOUT_MS);
    let response;
    try {
      response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeoutId);
    }
    const result = await response.json();
    if (result.status !== "success") throw new Error(result.message || "Submission failed");
    await loadAvailability();
    showSuccess(participants.length, false, String(result.submissionNumber || ""));
  } catch (error) {
    const verification = await verifySubmission(submissionId);
    if (verification.confirmed) {
      await loadAvailability();
      showSuccess(participants.length, true, verification.bookingId);
      return;
    }
    submitBtn.disabled = false;
    submitBtn.textContent = t("submit");
    showFailure(error && error.message ? error.message : t("failureMessage"));
  }
}

async function verifySubmission(submissionId){
  for (let attempt = 0; attempt < VERIFY_ATTEMPTS; attempt++) {
    try {
      const response = await fetch(SCRIPT_URL + "?action=getSubmissionStatus&submissionId=" + encodeURIComponent(submissionId) + "&_=" + Date.now());
      const result = await response.json();
      if (result && result.status === "success" && result.data && result.data.exists) {
        return { confirmed: true, bookingId: String(result.data.submissionNumber || "") };
      }
    } catch (error) {}
    if (attempt < VERIFY_ATTEMPTS - 1) await wait(VERIFY_WAIT_MS);
  }
  return { confirmed: false, bookingId: "" };
}

function showSuccess(count, verifiedAfterRetry, bookingId){
  document.getElementById("regForm").style.display = "none";
  const statusBox = document.getElementById("statusBox");
  statusBox.classList.add("show");
  statusBox.classList.remove("error");
  document.getElementById("statusTitle").textContent = t("successTitle");
  document.getElementById("statusMsg").textContent = formatMessage(verifiedAfterRetry ? t("successMessageRetry") : t("successMessage"), {
    count: count,
    bookingId: bookingId,
    agent: validatedAgent.name
  });
}

function showFailure(message){
  const statusBox = document.getElementById("statusBox");
  statusBox.classList.add("show", "error");
  document.getElementById("statusTitle").textContent = t("failureTitle");
  document.getElementById("statusMsg").textContent = message;
}

function showValidationModal(errors, firstInvalidField){
  validationFocusTarget = firstInvalidField || null;
  const list = document.getElementById("validationList");
  list.innerHTML = "";
  errors.forEach(function(message){
    const item = document.createElement("li");
    item.textContent = message;
    list.appendChild(item);
  });
  document.getElementById("validationModal").classList.add("show");
}

function closeValidationModal(){
  document.getElementById("validationModal").classList.remove("show");
  if (validationFocusTarget && typeof validationFocusTarget.scrollIntoView === "function") {
    validationFocusTarget.scrollIntoView({ behavior: "smooth", block: "center" });
    if (typeof validationFocusTarget.focus === "function") validationFocusTarget.focus({ preventScroll: true });
  }
}

function firstNonEmpty(values){
  for (let i = 0; i < values.length; i++) {
    const value = String(values[i] || "").trim();
    if (value) return value;
  }
  return "";
}

function formatMessage(template, values){
  return String(template).replace(/\{(\w+)\}/g, function(_, key){ return values[key] !== undefined ? values[key] : ""; });
}

function wait(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

function escapeHtml(value){
  return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
